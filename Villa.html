<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Aedificium Rōmānum - Der Villa-Baukasten</title>
    <style>
        :root {
            --roman-gold: #d4af37;
            --roman-bronze: #8c7853;
            --roman-marble: #f0e6d2;
            --roman-red: #800000;
            --bg-dark: #121212;
            --card-bg: #2d2d2d;
            --text-light: #f5f5f5;
            --font-display: 'Georgia', 'Times New Roman', serif;
            --font-body: 'Verdana', sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: no; }

        body {
            font-family: var(--font-body);
            background-color: var(--bg-dark);
            color: var(--text-light);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
        }

        h1 {
            color: var(--roman-gold);
            font-family: var(--font-display);
            text-transform: uppercase;
            font-size: 1.8rem;
            margin-bottom: 5px;
            text-align: center;
            letter-spacing: 2px;
        }

        .project-title {
            font-family: var(--font-display);
            color: var(--roman-marble);
            font-size: 1.1rem;
            font-style: italic;
            margin-bottom: 15px;
            text-align: center;
        }

        .game-container {
            width: 100%;
            max-width: 750px;
            background: var(--card-bg);
            border: 4px solid var(--roman-bronze);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.7);
            position: relative;
        }

        .building-site {
            width: 100%;
            height: 260px;
            background: linear-gradient(to bottom, #7ec0ee 0%, #ececec 50%, #66a15c 52%, #4d8044 100%);
            border: 3px solid #333;
            border-radius: 8px;
            position: relative;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.3);
            margin-bottom: 15px;
        }

        .blueprint-status {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0,0,0,0.7);
            padding: 5px 12px;
            border-radius: 15px;
            font-size: 0.85rem;
            color: var(--roman-gold);
            font-weight: bold;
            border: 1px solid var(--roman-bronze);
            z-index: 5;
        }

        /* Schwebendes Einfliegen der Bauteile */
        .build-part {
            opacity: 0;
            transform: translateY(-30px);
            transition: all 0.9s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .build-part.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .question-box {
            background: rgba(240, 230, 210, 0.08);
            border-left: 5px solid var(--roman-gold);
            padding: 15px;
            border-radius: 4px;
            text-align: center;
            margin-bottom: 15px;
            min-height: 85px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .q-type { font-size: 0.8rem; text-transform: uppercase; color: var(--roman-gold); font-weight: bold; margin-bottom: 4px; letter-spacing: 1px;}
        .q-text { font-family: var(--font-body); font-size: 1.2rem; color: var(--roman-marble); }

        .options-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .build-btn {
            background-color: #333;
            border: 2px solid var(--roman-bronze);
            color: var(--text-light);
            padding: 18px 10px;
            font-size: 1.05rem;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.1s;
            font-weight: bold;
            -webkit-tap-highlight-color: transparent;
        }

        .build-btn:not(:disabled):active { background-color: #444; }

        .correct { background-color: #4CAF50 !important; border-color: white !important; }
        .wrong { background-color: #F44336 !important; border-color: white !important; }

        .completion-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(20,20,20,0.95);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
            text-align: center;
            padding: 20px;
            z-index: 20;
        }

        .nav-btn {
            background: var(--roman-gold); color: var(--roman-red);
            font-family: var(--font-display); font-weight: bold; padding: 12px 35px;
            border: none; border-radius: 20px; font-size: 1.1rem; cursor: pointer;
            text-transform: uppercase; text-decoration: none; margin-top: 15px; display: inline-block;
        }
    </style>
</head>
<body>

        let builtPartsCount = 0;
        let currentCorrectAnswer = "";
        let activeDesign = 0; // 0 = Villa Rustica, 1 = Villa Urbana

        const designNames = [
            "Villa Rūstica (römisches Landgut)",
            "Villa Urbāna (vornehmer Stadtpalast)"
        ];

        const designMessages = [
            "Magnifice! Durch dein exzellentes Lateinwissen hast du eine meisterhafte römische Landvilla errichtet. Die Gutsverwalter danken dir!",
            "Sublīmis! Ein prachtvoller, goldglänzender Stadtpalast steht vollendet da. Du bist der unangefochtene Meisterarchitekt Roms!"
        ];

        function initGame() {
            builtPartsCount = 0;
            document.getElementById('progress-text').innerText = "0";
            document.getElementById('end-screen').style.display = 'none';
            
            // Zufälliges Design auswählen (0 oder 1)
            activeDesign = Math.floor(Math.random() * 2);
            document.getElementById('current-project').innerText = `Bauprojekt: ${designNames[activeDesign]}`;

            // Grafik-Zweige umschalten
            if (activeDesign === 0) {
                document.getElementById('design-0').style.display = "block";
                document.getElementById('design-1').style.display = "none";
            } else {
                document.getElementById('design-0').style.display = "none";
                document.getElementById('design-1').style.display = "block";
            }

            // Alle Bauteile beider Häuser zurücksetzen
            for(let d=0; d<2; d++) {
                for(let i=0; i<8; i++) {
                    document.getElementById(`d${d}-part${i}`).classList.remove('visible');
                }
            }
            nextQuestion();
        }

        function getSmartWrongMiddles(item) {
            let wrongs = [];
            if (item.type === 'noun') {
                let parts = item.middle.split(' ');
                let form = parts[0]; 
                let genus = parts[1] || 'm.';
                let oppGenus = (genus === 'm.') ? 'f.' : (genus === 'f.' ? 'm.' : 'n.');
                
                wrongs.push(`${form} ${oppGenus}`);
                let base = form.replace(/(is|ī|ae|iī|is|um|īs)$/, '');
                if (base.length < 2) base = form; 
                
                wrongs.push(`${base}ī ${genus}`);
                wrongs.push(`${base}ae ${genus}`);
                wrongs.push(`${base}is ${oppGenus}`);
            } else if (item.type === 'verb') {
                let form = item.middle;
                let base = form.replace(/(ō|iō|eō|ō)$/, '');
                if (base.length < 2) base = form;
                
                wrongs.push(`${base}it`);
                wrongs.push(`${base}at`);
                wrongs.push(`${base}et`);
                wrongs.push(`${base}unt`);
            }
            return [...new Set(wrongs)].filter(w => w !== item.middle && w !== "");
        }

        function nextQuestion() {
            const item = vocabularyPool[Math.floor(Math.random() * vocabularyPool.length)];
            let qType = Math.floor(Math.random() * 3);
            
            if (item.type === "other" && qType > 0) qType = 0;

            let categoryText = "";
            let questionText = "";
            let correctAnswer = "";
            let wrongPool = [];

            if (qType === 0) {
                categoryText = "🔮 Vokabel-Bedeutung";
                questionText = `Was bedeutet das Wort „${item.latin}“?`;
                correctAnswer = item.meaning;
                wrongPool = vocabularyPool.map(i => i.meaning).filter(m => m !== correctAnswer);
            } 
            else if (qType === 1) {
                if (item.type === "noun") {
                    categoryText = "🏛️ Genitiv & Geschlecht";
                    questionText = `Wie lauten Genitiv und Geschlecht von „${item.latin}“?`;
                } else if (item.type === "verb") {
                    categoryText = "⚡ Verb-Formen";
                    questionText = `Wie lautet die 1. Person Singular von „${item.latin}“?`;
                }
                correctAnswer = item.middle;
                
                wrongPool = getSmartWrongMiddles(item);
                if (wrongPool.length < 3) {
                    let backupPool = vocabularyPool.filter(i => i.type === item.type).map(i => i.middle).filter(m => m !== correctAnswer);
                    wrongPool = [...wrongPool, ...backupPool];
                }
            } 
            else if (qType === 2) {
                if (item.type === "noun") {
                    categoryText = "⚔️ Arena der Deklinationen";
                    questionText = `Zu welcher Deklination gehört „${item.latin}“ (${item.gram_clue})?`;
                    correctAnswer = item.gram_class;
                    wrongPool = ["a-Deklination", "o-Deklination", "konsonantische Deklination"].filter(c => c !== correctAnswer);
                } else if (item.type === "verb") {
                    categoryText = "🔥 Arena der Konjugationen";
                    questionText = `Zu welcher Konjugation gehört „${item.latin}“ (${item.gram_clue})?`;
                    correctAnswer = item.gram_class;
                    wrongPool = ["a-Konjugation", "e-Konjugation", "i-Konjugation", "konsonantische Konjugation"].filter(c => c !== correctAnswer);
                }
            }

            currentCorrectAnswer = correctAnswer;
            wrongPool = [...new Set(wrongPool)].sort(() => Math.random() - 0.5).slice(0, 3);
            while(wrongPool.length < 3) wrongPool.push("---");

            const options = [correctAnswer, ...wrongPool].sort(() => Math.random() - 0.5);

            document.getElementById('q-category').innerText = categoryText;
            document.getElementById('question-display').innerText = questionText;

            options.forEach((opt, idx) => {
                const btn = document.getElementById('opt' + idx);
                btn.innerText = opt;
                btn.className = "build-btn";
                btn.disabled = false;
            });
        }

        function checkAnswer(selectedIdx) {
            for(let i=0; i<4; i++) document.getElementById('opt' + i).disabled = true;

            const selectedText = document.getElementById('opt' + selectedIdx).innerText;
            const isCorrect = (selectedText === currentCorrectAnswer);

            if (isCorrect) {
                document.getElementById('opt' + selectedIdx).classList.add('correct');
                
                // Exakt das Teil des aktuell aktiven Designs einfliegen lassen
                if (builtPartsCount < 8) {
                    document.getElementById(`d${activeDesign}-part${builtPartsCount}`).classList.add('visible');
                    builtPartsCount++;
                    document.getElementById('progress-text').innerText = builtPartsCount;
                }
            } else {
                document.getElementById('opt' + selectedIdx).classList.add('wrong');
                for(let i=0; i<4; i++) {
                    if(document.getElementById('opt' + i).innerText === currentCorrectAnswer) {
                        document.getElementById('opt' + i).classList.add('correct');
                    }
                }
            }

            setTimeout(() => {
                if (builtPartsCount >= 8) {
                    document.getElementById('end-message').innerText = designMessages[activeDesign];
                    document.getElementById('end-screen').style.display = 'flex';
                } else {
                    nextQuestion();
                }
            }, 1500);
        }

        function resetGame() {
            initGame();
        }

        window.onload = initGame;
    </script>
</body>
</html>
