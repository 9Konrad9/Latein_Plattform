<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Tabulārium - Das Archiv</title>
    <style>
        :root {
            --roman-gold: #d4af37;
            --wood-dark: #2d1e16;
            --leather: #3e2723;
            --bronze: #8c7853;
            --papyrus: #eaddc5;
            --ink: #3e2723;
            --seal-red: #a82721;
            --chalkboard: #2f3640;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }

        body {
            font-family: 'Verdana', sans-serif;
            background-color: var(--wood-dark);
            background-image: radial-gradient(circle at center, #3d2a1e 0%, #1e130e 100%);
            color: #f0e6d2;
            /* Fallback für ältere iOS-Versionen: */
            height: 100vh; 
            /* Moderne dynamische Höhe: */
            height: 100dvh; 
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 10px 15px;
            overflow: hidden;
        }

        /* Fortschrittsanzeige */
        .header-area { width: 100%; max-width: 700px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .title { font-family: 'Georgia', serif; font-size: 1.5rem; color: var(--roman-gold); text-transform: uppercase; letter-spacing: 2px; }
        .progress-box { font-size: 0.9rem; color: #ccc; }
        .progress-bar-container { width: 150px; height: 10px; background: #111; border-radius: 5px; overflow: hidden; border: 1px solid var(--bronze); margin-top: 5px; }
        .progress-bar { width: 0%; height: 100%; background: var(--roman-gold); transition: width 0.3s; }

        /* Die Urkunde (Papyrus) */
        .scroll-container {
            width: 100%; max-width: 700px;
            background: var(--papyrus);
            border-radius: 4px;
            border: 2px solid #c2a17a;
            box-shadow: inset 0 0 20px rgba(139, 105, 20, 0.2), 0 10px 20px rgba(0,0,0,0.6);
            min-height: 130px;
            display: flex; justify-content: center; align-items: center;
            position: relative; margin-bottom: 20px;
        }

        .latin-text {
            font-family: 'Georgia', serif;
            font-size: 2.2rem;
            color: var(--ink);
            font-weight: bold;
            /* Erzwingt konsequente Kleinschreibung */
            text-transform: lowercase; 
            letter-spacing: 1px;
            text-align: center;
            padding: 20px;
        }

        /* Das Wachs-Siegel */
        .wax-seal {
            position: absolute;
            right: 20px; bottom: -20px;
            width: 60px; height: 60px;
            background: var(--seal-red);
            border-radius: 50%;
            border: 3px solid #731713;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5), 0 5px 10px rgba(0,0,0,0.5);
            display: none; align-items: center; justify-content: center;
            font-family: 'Georgia', serif; color: #ffcccc; font-size: 1.5rem; font-weight: bold;
            transform-origin: center;
        }
        
        @keyframes stamp {
            0% { transform: scale(3) rotate(15deg); opacity: 0; }
            50% { transform: scale(0.9) rotate(-5deg); opacity: 1; }
            100% { transform: scale(1) rotate(0deg); opacity: 1; }
        }
        .seal-active { display: flex !important; animation: stamp 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }

        /* Antwort-Buttons (2x2 Grid) */
        .options-grid {
            width: 100%; max-width: 700px;
            display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; flex-grow: 1;
        }

        .btn-translate {
            background: var(--leather); border: 2px solid var(--bronze); color: #f0e6d2;
            font-size: 1.1rem; padding: 12px 8px; border-radius: 8px; cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4); text-align: center; line-height: 1.3;
            touch-action: manipulation; -webkit-tap-highlight-color: transparent; transition: background 0.1s;
        }
        .btn-translate:not(:disabled):active { background: #5a3c36; transform: translateY(2px); }

        /* Der Archivar (Feedback Modal) */
        .modal-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); display: none; align-items: center; justify-content: center; z-index: 100;
        }
        .feedback-board {
            background: var(--chalkboard); width: 90%; max-width: 450px;
            border: 6px solid var(--bronze); border-radius: 8px; padding: 25px; text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }
        .feedback-title { color: #ffcc00; font-family: 'Georgia', serif; font-size: 1.5rem; margin-bottom: 15px; }
        .feedback-text { font-size: 1.1rem; line-height: 1.5; color: #f5f6fa; margin-bottom: 25px; }
        .btn-close {
            background: var(--roman-gold); color: var(--leather); border: none; padding: 12px 30px;
            font-size: 1.1rem; font-weight: bold; border-radius: 20px; cursor: pointer;
        }

        /* Endbildschirm */
        .end-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--wood-dark); display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 200; text-align: center;
        }
        .btn-main { background: var(--roman-gold); color: var(--leather); border: none; padding: 15px 40px; font-size: 1.2rem; font-weight: bold; border-radius: 30px; cursor: pointer; text-decoration: none; margin-top: 20px; text-transform: uppercase; }
    </style>
</head>
<body>

    <div class="header-area">
        <div class="title">Tabulārium</div>
        <div class="progress-box">
            Urkunden: <span id="prog-text">0 / 10</span>
            <div class="progress-bar-container"><div class="progress-bar" id="prog-bar"></div></div>
        </div>
    </div>

    <div class="scroll-container">
        <div class="latin-text" id="latin-display">lade urkunde...</div>
        <div class="wax-seal" id="seal">V</div>
    </div>

    <div class="options-grid">
        <button class="btn-translate" id="opt0">-</button>
        <button class="btn-translate" id="opt1">-</button>
        <button class="btn-translate" id="opt2">-</button>
        <button class="btn-translate" id="opt3">-</button>
    </div>

    <div class="modal-overlay" id="feedback-modal">
        <div class="feedback-board">
            <div class="feedback-title">Notiz des Archivars</div>
            <div class="feedback-text" id="feedback-text">Fehlertext</div>
            <button class="btn-close" onclick="closeModal()">Verstanden</button>
        </div>
    </div>

    <div class="end-screen" id="end-screen">
        <h1 style="color: var(--roman-gold); font-size: 2.5rem; margin-bottom: 20px; font-family: 'Georgia', serif;">Archiv sortiert!</h1>
        <p style="font-size: 1.2rem; max-width: 500px; line-height: 1.5; margin-bottom: 30px; padding: 0 15px;">Hervorragend! Du hast alle Besitzurkunden fehlerfrei zugeordnet. Der Herr der Villa ist zufrieden.</p>
        <button class="btn-main" onclick="location.reload()">Neuer Stapel</button>
        <br>
        <a href="index.html" class="btn-main" style="background: #444; color: #fff; font-size: 1rem; padding: 10px 25px;">Zurück zum Menü</a>
    </div>

    <script>

        const possessions = [

            { latSg: "canis", latPl: "canēs", deSg: "der Hund", dePl: "die Hunde", deBaseSg: "Hund", deBasePl: "Hunde", gen: "m", deGenSg: "des Hundes", deGenPl: "der Hunde" },
            { latSg: "tunica", latPl: "tunicae", deSg: "die Tunika", dePl: "die Tuniken", deBaseSg: "Tunika", deBasePl: "Tuniken", gen: "f", deGenSg: "der Tunika", deGenPl: "der Tuniken" },
            { latSg: "tabula", latPl: "tabulae", deSg: "das Wachstäfelchen", dePl: "die Wachstäfelchen", deBaseSg: "Wachstäfelchen", deBasePl: "Wachstäfelchen", gen: "f", deGenSg: "des Wachstäfelchens", deGenPl: "der Wachstäfelchen" },

            { id: "noster", lat: {m: ["noster","nostrī"], f: ["nostra","nostrae"], n: ["nostrum","nostra"]}, de: {m:"unser", f:"unsere", n:"unser", pl:"unsere"} },

        ];

                btns[idx].onclick = () => checkAnswer(opt);

            }

            let f2 = o.hasPl ? "Fast! Aber überprüfe den Besitzer (Genitiv). Steht diese Form im Singular oder im Plural?" : "Vorsicht bei der Übersetzung von Aulus! Steht das im Dativ oder im Genitiv?";

            let deP_Gen = pPlural ? p.deGenPl : p.deGenSg;
