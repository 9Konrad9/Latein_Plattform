<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Römisches Alltags-Quiz</title>
    <!-- Zuerst die Daten, dann die Logik -->
    <script src="quizData.js"></script>
    <script src="progress.js"></script>
    <style>
        :root {
            --roman-gold: #d4af37;
            --roman-red: #800000;
            --bg-dark: #121212;
            --card-bg: #222;
            --text-light: #e0d6c8;
        }
        body { font-family: 'Verdana', sans-serif; background: var(--bg-dark); color: var(--text-light); padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .quiz-container { width: 100%; max-width: 600px; background: var(--card-bg); padding: 20px; border-radius: 12px; border: 2px solid var(--roman-bronze); }
        .question { font-family: 'Georgia', serif; font-size: 1.3rem; margin-bottom: 20px; color: var(--roman-gold); }
        .btn-opt { display: block; width: 100%; padding: 15px; margin-bottom: 10px; background: #333; border: 1px solid #555; color: white; border-radius: 6px; cursor: pointer; text-align: left; }
        .btn-opt:active { background: #444; }
        .correct { background: #1b4d24 !important; border-color: #4CAF50 !important; }
        .wrong { background: #5c1b1b !important; border-color: #F44336 !important; }
    </style>
</head>
<body>

    <div class="quiz-container" id="quiz-box">
        <div id="q-area">
            <div id="category" style="font-size: 0.8rem; text-transform: uppercase; margin-bottom: 10px;"></div>
            <div class="question" id="question"></div>
            <div id="options"></div>
        </div>
    </div>

    <script>
        let currentQ = 0;
        let score = 0;
        let pool = quizQuestions.sort(() => Math.random() - 0.5);

        function loadQuestion() {
            let q = pool[currentQ];
            document.getElementById('category').innerText = q.category;
            document.getElementById('question').innerText = q.question;
            
            let opts = [q.correct, ...q.wrong].sort(() => Math.random() - 0.5);
            let html = "";
            opts.forEach(o => {
                html += `<button class="btn-opt" onclick="checkAnswer(this, '${o.replace(/'/g, "\\'")}', '${q.correct.replace(/'/g, "\\'")}')">${o}</button>`;
            });
            document.getElementById('options').innerHTML = html;
        }

        function checkAnswer(btn, selected, correct) {
            let btns = document.querySelectorAll('.btn-opt');
            btns.forEach(b => b.disabled = true);
            
            if(selected === correct) {
                btn.classList.add('correct');
                score++;
            } else {
                btn.classList.add('wrong');
                btns.forEach(b => {
                    if(b.innerText === correct) b.classList.add('correct');
                });
            }
            
            setTimeout(() => {
                currentQ++;
                if(currentQ < pool.length) loadQuestion();
                else {
                    LudiProgress.saveGameResult('quiz', score, pool.length);
                    const best = LudiProgress.getGameProgress('quiz').bestScore;
                    document.getElementById('quiz-box').innerHTML = `
                        <h2>Quiz beendet!</h2>
                        <p style="margin-top:15px;">Du hast <strong>${score} von ${pool.length}</strong> Fragen richtig beantwortet.</p>
                        <p style="opacity:0.7; margin-top:5px;">Bestleistung bisher: ${best} von ${pool.length}</p>
                        <a href="index.html" style="display:inline-block; margin-top:20px; color: var(--roman-gold);">Zurück zur Arena</a>
                    `;
                }
            }, 1500);
        }

        loadQuestion();
    </script>
</body>
</html>
