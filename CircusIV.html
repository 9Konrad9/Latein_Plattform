<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Circus Maximus - Championship Edition</title>
    <style>
        :root {
            --roman-gold: #d4af37;
            --roman-bronze: #8c7853;
            --roman-marble: #f0e6d2;
            --roman-red: #800000;
            --bg-dark: #121212;
            --card-bg: #2d2d2d;
            --text-light: #f5f5f5;
            --text-dark: #1a1a1a;

            --faction-russata: #cc0000;
            --faction-albata: #e0e0e0;
            --faction-prasina: #008800;
            --faction-veneta: #0000cc;

            --font-display: 'Georgia', 'Times New Roman', serif;
            --font-body: 'Verdana', sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            font-family: var(--font-body);
            background-color: var(--bg-dark);
            color: var(--text-light);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 10px;
            overflow-x: hidden;
            background-image: radial-gradient(circle, #2d2d2d 1px, rgba(0, 0, 0, 0) 1px);
            background-size: 30px 30px;
        }

        header {
            text-align: center;
            margin-bottom: 5px;
        }

        h1 {
            color: var(--roman-gold);
            font-family: var(--font-display);
            font-size: 2rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
        }

        h2 {
            font-family: var(--font-display);
            color: var(--roman-marble);
            margin-bottom: 10px;
        }

        .status-bar {
            width: 100%;
            max-width: 800px;
            display: flex;
            justify-content: space-between;
            background: #222;
            border: 2px solid var(--roman-bronze);
            padding: 10px 15px;
            border-radius: 8px;
            margin-bottom: 10px;
            font-weight: bold;
            font-size: 1.1rem;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        .timer-box { color: #ffcc00; }
        .score-box { color: var(--roman-marble); }

        .game-container {
            width: 100%;
            max-width: 800px;
            background: var(--card-bg);
            border: 5px solid var(--roman-bronze);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 12px 30px rgba(0,0,0,0.8);
            position: relative;
        }

        #setup-screen {
            text-align: center;
            padding: 20px 10px;
        }

        .faction-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin: 20px 0;
        }

        .faction-btn {
            padding: 25px;
            border: 3px solid transparent;
            border-radius: 8px;
            font-family: var(--font-display);
            font-size: 1.2rem;
            font-weight: bold;
            color: white;
            cursor: pointer;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
        }

        #btn-russata { background-color: var(--faction-russata); }
        #btn-albata { background-color: var(--faction-albata); color: var(--text-dark); text-shadow: none; }
        #btn-prasina { background-color: var(--faction-prasina); }
        #btn-veneta { background-color: var(--faction-veneta); }

        .faction-btn.selected {
            border-color: var(--roman-gold);
            box-shadow: 0 0 20px var(--roman-gold);
        }

        .track-container {
            position: relative;
            background: #cdb293; 
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="10" height="10" viewBox="0 0 10 10"><rect width="1" height="1" fill="%238b5a2b" opacity="0.3"/></svg>');
            border: 8px solid #8b5a2b;
            border-radius: 60px;
            height: 180px;
            margin-bottom: 20px;
            overflow: hidden;
            box-shadow: inset 0 5px 15px rgba(0,0,0,0.5);
        }

        .spina {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 65%;
            height: 35px;
            background: #c0c0c0;
            border: 3px solid #555;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            color: #333;
            font-family: var(--font-display);
            font-weight: bold;
            letter-spacing: 5px;
        }

        .chariot {
            position: absolute;
            width: 32px;
            height: 24px;
            border-radius: 4px;
            transition: all 0.5s ease-out;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: var(--font-display);
            font-weight: bold;
            font-size: 0.9rem;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.6);
            border: 2px solid #ccc;
        }

        .quiz-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .question-box {
            background: rgba(240, 230, 210, 0.1);
            border-left: 6px solid var(--roman-gold);
            padding: 15px;
            border-radius: 4px;
            text-align: center;
        }

        .question-box .question-type {
            font-size: 0.9rem;
            color: var(--roman-gold);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 5px;
            font-weight: bold;
        }

        .question-box .latin-word {
            font-family: var(--font-display);
            font-size: 1.6rem;
            font-weight: bold;
            color: var(--roman-marble);
            line-height: 1.4;
        }

        .options-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .option-btn {
            background-color: var(--card-bg);
            border: 3px solid var(--roman-bronze);
            color: var(--roman-marble);
            padding: 20px 10px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.1s ease;
            -webkit-tap-highlight-color: transparent;
        }

        .option-btn:not(:disabled):active {
            transform: translateY(2px);
        }

        .round-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
            border-radius: 12px;
            text-align: center;
            padding: 20px;
        }

        .start-btn {
            background-color: var(--roman-gold);
            color: var(--roman-red);
            font-family: var(--font-display);
            border: none;
            padding: 15px 40px;
            font-size: 1.4rem;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            margin-top: 20px;
            text-transform: uppercase;
            box-shadow: 0 5px 15px rgba(212, 175, 55, 0.4);
        }

        .correct { background-color: #4CAF50 !important; border-color: #4CAF50 !important; color: white !important; }
        .wrong { background-color: #F44336 !important; border-color: #F44336 !important; color: white !important; }
    </style>
</head>
<body>

    <header>
        <h1>Circus Maximus</h1>
    </header>

    <div class="status-bar" id="status-bar" style="display:none;">
        <div class="timer-box">⏳ Zeit: <span id="timer-display">5:00</span></div>
        <div class="score-box">🏆 Deine Siege: <span id="player-wins">0</span> | Gegner-Siege: <span id="ai-wins">0</span></div>
    </div>

    <div class="game-container">
        <div class="round-overlay" id="round-overlay">
            <h2 id="overlay-title">Rundenende</h2>
            <p id="overlay-msg" style="font-size: 1.2rem; margin: 15px 0;"></p>
            <button class="start-btn" onclick="nextRace()">Nächstes Rennen!</button>
        </div>

        <div id="setup-screen">
            <h2>Wähle deine Factio:</h2>
            <div class="faction-grid">
                <button class="faction-btn" id="btn-russata" onclick="selectFaction('russata')">russata (rot)</button>
                <button class="faction-btn" id="btn-albata" onclick="selectFaction('albata')">albata (weiß)</button>
                <button class="faction-btn" id="btn-prasina" onclick="selectFaction('prasina')">prasina (grün)</button>
                <button class="faction-btn" id="btn-veneta" onclick="selectFaction('veneta')">veneta (blau)</button>
            </div>
            <p style="color: #aaa; font-style: italic;">Das Spiel dauert genau 5 Minuten. Gewinne so viele Rennen wie möglich!</p>
            <button class="start-btn" id="start-race-btn" style="display:none;" onclick="startGameSession()">Meisterschaft starten!</button>
        </div>

        <div id="race-screen" style="display:none;">
            <div class="track-container">
                <div class="spina">SPINA</div>
                <div class="chariot" id="chariot-russata" style="background:var(--faction-russata); color: white;">r</div>
                <div class="chariot" id="chariot-albata" style="background:var(--faction-albata); color: var(--text-dark);">a</div>
                <div class="chariot" id="chariot-prasina" style="background:var(--faction-prasina); color: white;">p</div>
                <div class="chariot" id="chariot-veneta" style="background:var(--faction-veneta); color: white;">v</div>
            </div>

            <div class="quiz-container">
                <div class="question-box">
                    <div class="question-type" id="q-type">Frage</div>
                    <div class="latin-word" id="q-latin">---</div>
                </div>
                <div class="options-grid">
                    <button class="option-btn" id="opt0" onclick="checkAnswer(0)">-</button>
                    <button class="option-btn" id="opt1" onclick="checkAnswer(1)">-</button>
                    <button class="option-btn" id="opt2" onclick="checkAnswer(2)">-</button>
                    <button class="option-btn" id="opt3" onclick="checkAnswer(3)">-</button>
                </div>
            </div>
        </div>

        <div id="end-screen" style="display:none; text-align:center; padding: 20px 10px;">
            <h2 id="end-title" style="font-size: 2.2rem; color: var(--roman-gold);">MEISTERSCHAFT BEENDET</h2>
            <p id="end-msg" style="margin: 20px 0; font-size: 1.3rem; line-height: 1.6;"></p>
            <button class="start-btn" onclick="resetGame()">Neue Meisterschaft</button>
        </div>
    </div>

        // NEUER ALGORITHMUS: Erzeugt hoch-relevante, morphologisch ähnliche Falschantworten auf Basis des gleichen Wortstammes!
        function getSmartWrongMiddles(item) {
            let wrongs = [];
            if (item.type === 'noun') {
                let parts = item.middle.split(' ');
                let form = parts[0]; 
                let genus = parts[1] || 'm.';
                let oppGenus = (genus === 'm.') ? 'f.' : (genus === 'f.' ? 'm.' : 'n.');
                
                // 1. Richtige Form, aber falsches Geschlecht
                wrongs.push(`${form} ${oppGenus}`);
                
                // Stamm isolieren für clevere Endungsfehler (z.B. cani-s -> cani-ī)
                let base = form.replace(/(is|ī|ae|iī|is|um|īs)$/, '');
                if (base.length < 2) base = form; 
                
                wrongs.push(`${base}ī ${genus}`);
                wrongs.push(`${base}ae ${genus}`);
                wrongs.push(`${base}ī ${oppGenus}`);
                wrongs.push(`${base}is ${oppGenus}`);
            } else if (item.type === 'verb') {
                let form = item.middle;
                let base = form.replace(/(ō|iō|eō|ō)$/, '');
                if (base.length < 2) base = form;
                
                wrongs.push(`${base}it`);
                wrongs.push(`${base}at`);
                wrongs.push(`${base}et`);
                wrongs.push(`${base}unt`);
            }
            // Filtern und Duplikate löschen
            return [...new Set(wrongs)].filter(w => w !== item.middle && w !== "");
        }

        function generateQuestion() {

            let questionText = "";
            let categoryText = "";
            let correctAnswer = "";
            let wrongPool = [];

            if (qType === 0) {

                questionText = `Was bedeutet das Wort „${item.latin}“?`;
                correctAnswer = item.meaning;
                wrongPool = vocabularyPool.map(i => i.meaning).filter(m => m !== correctAnswer);
            } 
            else if (qType === 1) {
                if (item.type === "noun") {
                    categoryText = "🏛️ Genitiv & Geschlecht";
                    questionText = `Wie lauten Genitiv und Geschlecht von „${item.latin}“?`;
                } else if (item.type === "verb") {
                    categoryText = "⚡ Verb-Formen";
                    questionText = `Wie lautet die 1. Person Singular von „${item.latin}“?`;
                }
                correctAnswer = item.middle;
                
                // Nutze die neue intelligente Ablenker-Logik
                wrongPool = getSmartWrongMiddles(item);
                
                // Sicherheitsnetz: Falls zu wenig morphologische Treffer, mit normalen Formen auffüllen
                if (wrongPool.length < 3) {
                    let backupPool = vocabularyPool.filter(i => i.type === item.type).map(i => i.middle).filter(m => m !== correctAnswer);
                    wrongPool = [...wrongPool, ...backupPool];
                }
            } 
            else if (qType === 2) {
                if (item.type === "noun") {
                    categoryText = "⚔️ Arena der Deklinationen";
                    questionText = `Zu welcher Deklination gehört „${item.latin}“ (${item.gram_clue})?`;
                    correctAnswer = item.gram_class;
                    wrongPool = ["a-Deklination", "o-Deklination", "konsonantische Deklination"].filter(c => c !== correctAnswer);
                } else if (item.type === "verb") {
                    categoryText = "🔥 Arena der Konjugationen";
                    questionText = `Zu welcher Konjugation gehört „${item.latin}“ (${item.gram_clue})?`;
                    correctAnswer = item.gram_class;
                    wrongPool = ["a-Konjugation", "e-Konjugation", "i-Konjugation", "konsonantische Konjugation", "gemischte Konjugation"].filter(c => c !== correctAnswer);
                }
            }

            currentCorrectAnswer = correctAnswer;

            wrongPool = [...new Set(wrongPool)].sort(() => Math.random() - 0.5).slice(0, 3);
            while(wrongPool.length < 3) wrongPool.push("---");

            const options = [correctAnswer, ...wrongPool].sort(() => Math.random() - 0.5);

            document.getElementById('q-type').innerText = categoryText;
            document.getElementById('q-latin').innerText = questionText;

            options.forEach((opt, idx) => {
                const btn = document.getElementById('opt' + idx);
                btn.innerText = opt;
                btn.disabled = false;
                btn.className = 'option-btn';
            });
        }

        function checkAnswer(selectedIdx) {
            for(let i=0; i<4; i++) document.getElementById('opt'+i).disabled = true;

            const selectedText = document.getElementById('opt' + selectedIdx).innerText;
            const isCorrect = (selectedText === currentCorrectAnswer);

            if (isCorrect) {
                document.getElementById('opt' + selectedIdx).classList.add('correct');
                positions[playerFaction] += 20; 
            } else {
                document.getElementById('opt' + selectedIdx).classList.add('wrong');
                for(let i=0; i<4; i++) {
                    if(document.getElementById('opt'+i).innerText === currentCorrectAnswer) {
                        document.getElementById('opt'+i).classList.add('correct');
                    }
                }
                for (let fac in positions) {
                    if (fac !== playerFaction) positions[fac] += 15;
                }
            }

            updateTrackPositions();

            setTimeout(() => {
                let winner = null;
                for (let fac in positions) {
                    if (positions[fac] >= winningScore) {
                        winner = fac;
                        break;
                    }
                }

                if (winner) {
                    handleRaceEnd(winner);
                } else {
                    generateQuestion();
                }
            }, 1200);
        }

        function handleRaceEnd(winner) {
            const overlay = document.getElementById('round-overlay');
            const title = document.getElementById('overlay-title');
            const msg = document.getElementById('overlay-msg');
            
            overlay.style.display = 'flex';

            if (winner === playerFaction) {
                wins.player++;
                title.innerText = "🎉 RUNDENSIEG!";
                title.style.color = "#4CAF50";
                msg.innerHTML = `Exzellent! Deine Factio <strong>${winner}</strong> fährt als Erste durchs Ziel! +1 Punkt für dich.`;
            } else {
                wins.ai++;
                title.innerText = "🐴 GEGNER-SIEG!";
                title.style.color = "#F44336";
                msg.innerHTML = `Die gegnerische Factio <strong>${winner}</strong> gewinnt dieses Rennen. Die KI holt den Punkt.`;
            }
            updateStatusBar();
        }

        function nextRace() {
            if (timeRemaining > 0) {
                startNewRace();
            }
        }

        function endGameSession() {
            clearInterval(timerInterval);
            document.getElementById('race-screen').style.display = 'none';
            document.getElementById('round-overlay').style.display = 'none';
            document.getElementById('end-screen').style.display = 'block';

            const msg = document.getElementById('end-msg');
            
            if (wins.player > wins.ai) {
                msg.innerHTML = `🏆 <strong>Glorreicher Triumph!</strong> 🏆<br><br>Du hast die Meisterschaft nach 5 Minuten mit <strong>${wins.player} : ${wins.ai}</strong> Siegen gewonnen!<br>Deine 6er haben den kaiserlichen Lorbeerkranz errungen!`;
            } else if (wins.player < wins.ai) {
                msg.innerHTML = `🛡️ <strong>Knappe Niederlage!</strong> 🛡️<br><br>Die KI gewinnt die Meisterschaft mit <strong>${wins.ai} : ${wins.player}</strong> Siegen.<br>Die Pferde brauchen beim nächsten Mal wohl noch etwas mehr Vokabel-Tuning!`;
            } else {
                msg.innerHTML = `🤝 <strong>Unentschieden!</strong> 🤝<br><br>Es steht am Ende unentschieden <strong>${wins.player} : ${wins.ai}</strong>.<br>Ein packendes Kopf-an-Kopf-Rennen im antiken Rom!`;
            }
        }

        function resetGame() {
            document.getElementById('end-screen').style.display = 'none';
            document.getElementById('status-bar').style.display = 'none';
            document.getElementById('setup-screen').style.display = 'block';
            document.getElementById('start-race-btn').style.display = 'none';
            document.querySelectorAll('.faction-btn').forEach(btn => btn.classList.remove('selected'));
        }

        function updateTrackPositions() {
            const factions = ['russata', 'albata', 'prasina', 'veneta'];
            factions.forEach((fac, index) => {
                const chariot = document.getElementById('chariot-' + fac);
                const progress = Math.min(positions[fac] / winningScore, 1.0);
                const laneOffset = index * 10;
                const width = 740 - laneOffset * 2;
                const height = 160 - laneOffset * 2;
                const angle = progress * Math.PI * 2 + Math.PI;
                const centerX = 400;
                const centerY = 90;
                const xVal = centerX + (width/2) * Math.cos(angle);
                const yVal = centerY + (height/2) * Math.sin(angle);
                chariot.style.left = (xVal - 16) + 'px';
                chariot.style.top = (yVal - 12) + 'px';
            });
        }

        window.onresize = updateTrackPositions;
    </script>
</body>
</html>
