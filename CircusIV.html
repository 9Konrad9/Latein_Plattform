<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Circus Maximus - Das Vokabel-Wagenrennen</title>
    <!-- Einbindung der zentralen Vokabeldatenbank -->
    <script src="vocabulary.js"></script>
    <style>
        :root {
            --roman-gold: #d4af37;
            --roman-bronze: #8c7853;
            --roman-marble: #f0e6d2;
            --roman-red: #800000;
            --bg-dark: #121212;
            --card-bg: #2d2d2d;
            --text-light: #f5f5f5;
            --font-display: 'Georgia', 'Times New Roman', serif;
            --font-body: 'Verdana', sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }

        body {
            font-family: var(--font-body);
            background-color: var(--bg-dark);
            color: var(--text-light);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
        }

        h1 {
            color: var(--roman-gold);
            font-family: var(--font-display);
            text-transform: uppercase;
            font-size: 1.8rem;
            margin-bottom: 5px;
            text-align: center;
            letter-spacing: 2px;
        }

        .game-container {
            width: 100%;
            max-width: 700px;
            background: var(--card-bg);
            border: 4px solid var(--roman-bronze);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.7);
            position: relative;
        }

        /* Rennbahn-Visualisierung */
        .race-track {
            background: linear-gradient(to bottom, #755139 0%, #a07151 50%, #755139 100%);
            border: 3px solid #333;
            border-radius: 8px;
            height: 100px;
            position: relative;
            margin-bottom: 15px;
            overflow: hidden;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.5);
        }

        .track-line {
            position: absolute;
            top: 50%; left: 0; width: 100%;
            border-top: 2px dashed rgba(255,255,255,0.3);
        }

        /* Der Streitwagen (Chariot) */
        .chariot-wrapper {
            position: absolute;
            left: 10%;
            top: 25%;
            width: 60px;
            height: 50px;
            transition: left 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.15);
        }

        .meta-line {
            position: absolute;
            right: 40px; top: 0; width: 8px; height: 100%;
            background: stroke;
            background-image: linear-gradient(45deg, #fff 25%, transparent 25%), linear-gradient(-45deg, #fff 25%, transparent 25%), linear-gradient(45deg, transparent 75%, #fff 75%), linear-gradient(-45deg, transparent 75%, #fff 75%);
            background-size: 8px 8px;
            background-color: #111;
        }

        /* Statusleiste */
        .status-bar {
            display: flex;
            justify-content: space-between;
            font-family: var(--font-display);
            color: var(--roman-gold);
            font-size: 1.1rem;
            font-weight: bold;
            margin-bottom: 15px;
            border-bottom: 1px solid #444;
            padding-bottom: 5px;
        }

        /* Frage-Box */
        .question-box {
            background: rgba(240, 230, 210, 0.07);
            border-left: 5px solid var(--roman-gold);
            padding: 15px;
            border-radius: 4px;
            text-align: center;
            margin-bottom: 20px;
            min-height: 90px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .q-category {
            font-size: 0.8rem;
            text-transform: uppercase;
            color: var(--roman-gold);
            font-weight: bold;
            margin-bottom: 5px;
            letter-spacing: 1px;
        }

        .q-text {
            font-family: var(--font-display);
            font-size: 1.4rem;
            color: var(--roman-marble);
            font-weight: bold;
        }

        /* Antwort-Tasten */
        .options-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .race-btn {
            background-color: #333;
            border: 2px solid var(--roman-bronze);
            color: var(--text-light);
            padding: 18px 10px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.1s;
            -webkit-tap-highlight-color: transparent;
            text-align: center;
        }

        .race-btn:not(:disabled):active { background-color: #444; }

        .correct { background-color: #4CAF50 !important; border-color: white !important; }
        .wrong { background-color: #F44336 !important; border-color: white !important; }

        /* Endbildschirm */
        .end-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(20,20,20,0.96);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
            text-align: center;
            padding: 20px;
            z-index: 30;
        }

        .nav-btn {
            background: var(--roman-gold); color: var(--roman-red);
            font-family: var(--font-display); font-weight: bold; padding: 12px 35px;
            border: none; border-radius: 20px; font-size: 1.1rem; cursor: pointer;
            text-transform: uppercase; text-decoration: none; margin-top: 15px; display: inline-block;
        }
    </style>
</head>
<body>

    <h1>Circus Maximus: Chariot Race</h1>
    <div style="font-family: var(--font-display); font-style: italic; color: #aaa; margin-bottom: 15px; text-align: center;">
        Smarter Modus: Distraktoren sind strikt an die Wortart angepasst!
    </div>

    <div class="game-container">
        <!-- Endbildschirm -->
        <div class="end-overlay" id="end-screen">
            <h2 style="font-family: var(--font-display); color: var(--roman-gold); font-size: 2rem;" id="end-title">ZIELEREICHT!</h2>
            <p style="font-size: 1.2rem; margin: 15px 0; max-width: 500px; line-height: 1.5;" id="end-msg">
                Meisterhaft gesteuert! Du hast das Ziel erreicht.
            </p>
            <button class="nav-btn" onclick="resetRace()">Neues Rennen starten</button>
            <br>
            <a href="index.html" class="nav-btn" style="background: #444; color: #fff; font-size: 0.9rem; padding: 8px 20px;">Zurück zum Menü</a>
        </div>

        <!-- Rennbahn -->
        <div class="race-track">
            <div class="track-line"></div>
            <div class="meta-line"></div>
            <!-- Streitwagen SVG -->
            <div class="chariot-wrapper" id="chariot">
                <svg width="100%" height="100%" viewBox="0 0 64 48">
                    <!-- Pferde stilisierte Boxen -->
                    <rect x="35" y="10" width="22" height="12" fill="#8b5a2b" rx="2"/>
                    <rect x="35" y="26" width="22" height="12" fill="#a0522d" rx="2"/>
                    <!-- Zügel -->
                    <line x1="20" y1="16" x2="35" y2="16" stroke="#d4af37" stroke-width="1.5"/>
                    <line x1="20" y1="32" x2="35" y2="32" stroke="#d4af37" stroke-width="1.5"/>
                    <!-- Wagenkorb -->
                    <path d="M5 12 L20 10 L22 38 L5 36 Z" fill="#800000" stroke="#d4af37" stroke-width="1.5"/>
                    <!-- Räder -->
                    <circle cx="12" cy="10" r="6" fill="#111" stroke="#d4af37"/>
                    <circle cx="12" cy="38" r="6" fill="#111" stroke="#d4af37"/>
                    <!-- Fahrer Silhouette -->
                    <circle cx="14" cy="24" r="4" fill="#f0e6d2"/>
                </svg>
            </div>
        </div>

        <!-- Status -->
        <div class="status-bar">
            <span>Runde: <span id="lap-text">1</span> / 3</span>
            <span>Fortschritt: <span id="streak-text">0</span>%</span>
        </div>

        <!-- Fragebereich -->
        <div id="quiz-area">
            <div class="question-box">
                <div class="q-category" id="category-display">Kategorie</div>
                <div class="q-text" id="question-display">Frage wird geladen...</div>
            </div>
            <div class="options-grid">
                <button class="race-btn" id="opt0" onclick="checkAnswer(0)">-</button>
                <button class="race-btn" id="opt1" onclick="checkAnswer(1)">-</button>
                <button class="race-btn" id="opt2" onclick="checkAnswer(2)">-</button>
                <button class="race-btn" id="opt3" onclick="checkAnswer(3)">-</button>
            </div>
        </div>
    </div>

    <script>
        let currentStreak = 0;
        let currentLap = 1;
        const totalLaps = 3;
        let currentCorrectAnswer = "";

        // Technische Verifizierung der Datenbankverbindung bei Start
        function initRace() {
            if (typeof globalVocabularyPool === 'undefined' || globalVocabularyPool.length === 0) {
                alert("Fehler: Die Datei 'vocabulary.js' konnte nicht geladen werden oder ist leer!");
                return;
            }
            currentStreak = 0;
            currentLap = 1;
            updateUI();
            document.getElementById('end-screen').style.display = 'none';
            nextQuestion();
        }

        function updateUI() {
            document.getElementById('lap-text').innerText = currentLap;
            
            // Berechne die optische Position des Wagens auf der Schiene (0% - 80% max)
            let progressPercent = Math.floor((currentStreak / 5) * 100);
            document.getElementById('streak-text').innerText = progressPercent;
            
            let visualLeft = 10 + (currentStreak * 14); // Skaliert Chariot auf der X-Achse
            document.getElementById('chariot').style.left = visualLeft + "%";
        }

        function nextQuestion() {
            // 1. Zufälliges Wort aus der Master-Datenbank ziehen
            const item = globalVocabularyPool[Math.floor(Math.random() * globalVocabularyPool.length)];
            
            // 2. Ermitteln, welche Fragetypen für dieses spezifische Wort erlaubt sind
            let allowedTypes = [0]; // Bedeutung geht immer
            if (item.type === "noun" || item.type === "verb") {
                allowedTypes.push(1, 2); // Formen & Klassen
            } else if (item.type === "adjective") {
                allowedTypes.push(2); // Nur Klassen (a-/o-Deklination)
            }

            const qType = allowedTypes[Math.floor(Math.random() * allowedTypes.length)];

            let categoryText = "";
            let questionText = "";
            let wrongPool = [];

            // ================= FRAGETYP 0: BEDEUTUNG =================
            if (qType === 0) {
                categoryText = `🔮 Bedeutung — Wortart: ${translateType(item.type)}`;
                questionText = `Was bedeutet „${item.latin}“?`;
                currentCorrectAnswer = item.meaning;

                // STRIKTER FILTER: Nur Bedeutungen von Wörtern DESSELBEN TYPS erlaubt!
                wrongPool = globalVocabularyPool
                    .filter(i => i.type === item.type && i.meaning !== currentCorrectAnswer)
                    .map(i => i.meaning);
            } 
            // ================= FRAGETYP 1: GRAMMATISCHE FORMEN =================
            else if (qType === 1) {
                if (item.type === "noun") {
                    categoryText = "🏛️ Substantiv-Formen (Genitiv & Geschlecht)";
                    questionText = `Wie lauten Genitiv und Geschlecht von „${item.latin}“?`;
                } else {
                    categoryText = "⚡ Verb-Formen (1. Person Singular)";
                    questionText = `Wie lautet die 1. Person Singular Präsens von „${item.latin}“?`;
                }
                currentCorrectAnswer = item.middle;

                // STRIKTER FILTER: Nur Formen aus derselben Wortart als Distraktoren
                wrongPool = globalVocabularyPool
                    .filter(i => i.type === item.type && i.middle !== currentCorrectAnswer && i.middle !== "Ausruf" && i.middle !== "Adv.")
                    .map(i => i.middle);
            } 
            // ================= FRAGETYP 2: DEKLINATIONS- / KONJUGATIONSKLASSE =================
            else if (qType === 2) {
                if (item.type === "noun") {
                    categoryText = "⚔️ Deklinationsklassen";
                    questionText = `Zu welcher Deklination gehört „${item.latin}“ (${item.gram_clue})?`;
                    currentCorrectAnswer = item.gram_class;
                    wrongPool = ["a-Deklination", "o-Deklination", "konsonantische Deklination"].filter(c => c !== currentCorrectAnswer);
                } else if (item.type === "verb") {
                    categoryText = "🔥 Konjugationsklassen";
                    questionText = `Zu welcher Konjugation gehört „${item.latin}“?`;
                    currentCorrectAnswer = item.gram_class;
                    wrongPool = ["a-Konjugation", "e-Konjugation", "i-Konjugation", "konsonantische Konjugation", "gemischte Konjugation"].filter(c => c !== currentCorrectAnswer);
                } else if (item.type === "adjective") {
                    categoryText = "🎨 Adjektiv-Klassen";
                    questionText = `Welcher Deklinationsklasse folgt das Adjektiv „${item.latin}“?`;
                    currentCorrectAnswer = item.gram_class;
                    wrongPool = ["konsonantische Deklination", "u-Deklination", "e-Deklination"].filter(c => c !== currentCorrectAnswer);
                }
            }

            // 3. Fehler-Sicherung: Falls der Pool der gleichen Wortart zu klein ist, mit generischen Werten auffüllen
            wrongPool = [...new Set(wrongPool)].sort(() => Math.random() - 0.5).slice(0, 3);
            while (wrongPool.length < 3) {
                wrongPool.push("---");
            }

            // 4. Optionen mischen
            const finalOptions = [currentCorrectAnswer, ...wrongPool].sort(() => Math.random() - 0.5);

            // 5. UI befüllen
            document.getElementById('category-display').innerText = categoryText;
            document.getElementById('question-display').innerText = questionText;

            for (let i = 0; i < 4; i++) {
                const btn = document.getElementById('opt' + i);
                btn.innerText = finalOptions[i];
                btn.className = "race-btn";
                btn.disabled = false;
            }
        }

        function checkAnswer(selectedIdx) {
            for (let i = 0; i < 4; i++) document.getElementById('opt' + i).disabled = true;

            const selectedText = document.getElementById('opt' + selectedIdx).innerText;
            const isCorrect = (selectedText === currentCorrectAnswer);

            if (isCorrect) {
                document.getElementById('opt' + selectedIdx).classList.add('correct');
                currentStreak++;
            } else {
                document.getElementById('opt' + selectedIdx).classList.add('wrong');
                for (let i = 0; i < 4; i++) {
                    if (document.getElementById('opt' + i).innerText === currentCorrectAnswer) {
                        document.getElementById('opt' + i).classList.add('correct');
                    }
                }
                currentStreak = Math.max(0, currentStreak - 1); // Wagen fällt bei Fehler leicht zurück
            }

            updateUI();

            setTimeout(() => {
                if (currentStreak >= 5) { // Eine Runde auf der Bahn geschafft!
                    if (currentLap < totalLaps) {
                        currentLap++;
                        currentStreak = 0;
                        updateUI();
                        nextQuestion();
                    } else {
                        endGame();
                    }
                } else {
                    nextQuestion();
                }
            }, 1200);
        }

        function translateType(type) {
            const types = {
                noun: "Substantiv (Nomen)",
                verb: "Verb (Zeitwort)",
                adjective: "Adjektiv (Eigenschaftswort)",
                adverb: "Adverb (Umstandswort)",
                preposition: "Präposition (Verhältniswort)",
                pronoun: "Pronomen (Fürwort)",
                conjunction: "Konjunktion (Bindewort)",
                other: "Partikel / Ausruf"
            };
            return types[type] || type;
        }

        function endGame() {
            document.getElementById('end-screen').style.display = 'flex';
            document.getElementById('end-title').innerText = "🏆 VICTORIA! 🏆";
            document.getElementById('end-msg').innerHTML = `Sensationell! Du hast alle 3 Runden im Circus Maximus überstanden und fährst als glorreicher Sieger über die Ziellinie!`;
        }

        function resetRace() {
            initRace();
        }

        window.onload = initRace;
    </script>
</body>
</html>
