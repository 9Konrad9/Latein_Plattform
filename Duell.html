<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Gladiatoren-Duell - Split-Screen</title>
    <script src="vocabulary.js"></script>
    <script src="progress.js"></script>
    <script src="lessonFilter.js"></script>
    <style>
        :root {
            --roman-gold: #d4af37;
            --roman-bronze: #8c7853;
            --roman-red: #800000;
            --bg-dark: #121212;
            --card-bg: #2d2d2d;
            --text-light: #f5f5f5;
            --font-display: 'Georgia', 'Times New Roman', serif;
            --font-body: 'Verdana', sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: var(--font-body);
            background-color: var(--bg-dark);
            color: var(--text-light);
            height: 100dvh; /* Nutzt die dynamische iPad-Bildschirmhöhe! */
            display: flex;
            flex-direction: column;
            overflow: hidden;
            -webkit-user-select: none;
        }

        .divider {
            height: 4px;
            background: var(--roman-gold);
            width: 100%;
            box-shadow: 0 0 10px rgba(0,0,0,0.8);
            z-index: 10;
        }

        .player-zone {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 8px 12px; /* Etwas kompakter für iPads */
            position: relative;
            background-color: #1a1a1a;
            transition: background-color 0.2s ease;
        }

        #player1 { transform: rotate(180deg); background-color: #221515; }
        #player2 { background-color: #151522; }

        .header-bar {
            display: flex; justify-content: space-between; align-items: center;
            font-family: var(--font-display); font-size: 0.95rem; color: var(--roman-gold);
            border-bottom: 1px solid #444; padding-bottom: 4px;
        }

        .health-display { font-size: 1.1rem; letter-spacing: 2px; }

        .arena-visuals {
            display: flex; align-items: center; justify-content: center;
            margin: 2px 0;
        }

        .gladiator-svg { width: 45px; height: 45px; filter: drop-shadow(2px 2px 4px rgba(0,0,0,0.5)); }

        .question-container {
            flex-grow: 1; display: flex; flex-direction: column; justify-content: center;
            text-align: center; padding: 6px; background: rgba(0,0,0,0.4);
            border-radius: 6px; border-left: 4px solid var(--roman-gold); margin-bottom: 6px; min-height: 65px;
        }

        .q-type { font-size: 0.75rem; text-transform: uppercase; color: var(--roman-gold); font-weight: bold; margin-bottom: 2px; letter-spacing: 1px; }
        .q-text { font-family: var(--font-body); font-size: 1.1rem; color: var(--roman-marble); line-height: 1.2; }

        .answers-grid {
            display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px;
        }

        .arena-btn {
            background: var(--card-bg); border: 2px solid var(--roman-bronze);
            color: white; padding: 12px 4px; font-size: 1rem; font-weight: bold;
            border-radius: 6px; cursor: pointer; text-align: center;
            touch-action: manipulation; -webkit-tap-highlight-color: transparent;
        }
        .arena-btn:not(:disabled):active { background: #444; }

        .countdown-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15,15,15,0.92); display: flex; flex-direction: column;
            align-items: center; justify-content: center; z-index: 20;
            font-family: var(--font-display); font-size: 3rem; color: var(--roman-gold);
            font-weight: bold; text-transform: uppercase;
        }

        .flash-correct { background-color: #4CAF50 !important; }
        .flash-wrong { background-color: #F44336 !important; }

        .end-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95); display: none; flex-direction: column;
            align-items: center; justify-content: center; z-index: 100; text-align: center; padding: 20px;
        }

        .end-title { font-family: var(--font-display); font-size: 2.2rem; color: var(--roman-gold); margin-bottom: 15px; }
        .end-btn {
            background: var(--roman-gold); color: var(--roman-red);
            font-family: var(--font-display); font-weight: bold; padding: 12px 35px;
            border: none; border-radius: 20px; font-size: 1.2rem; cursor: pointer;
            text-transform: uppercase; text-decoration: none; margin-top: 15px; display: inline-block;
            touch-action: manipulation;
        }
    </style>
</head>
<body>

    <div class="player-zone" id="player1">
        <div class="countdown-overlay" id="p1-countdown">5</div>
        <div class="header-bar">
            <span>factio russata (rot)</span>
            <div class="health-display" id="p1-health">❤️❤️❤️❤️❤️</div>
        </div>
        <div class="arena-visuals">
            <svg class="gladiator-svg" viewBox="0 0 64 64">
                <circle cx="32" cy="32" r="30" fill="#333" stroke="#cc0000" stroke-width="2"/>
                <path d="M22 18 Q32 2 42 18 Z" fill="#cc0000"/>
                <rect x="24" y="18" width="16" height="20" fill="#d4af37" rx="3"/>
                <rect x="28" y="24" width="8" height="6" fill="#111"/>
                <path d="M12 28 L20 48 L12 48 Z" fill="#cc0000" stroke="#fff"/>
            </svg>
        </div>
        <div class="question-container">
            <div class="q-type" id="p1-qtype">Bereitmachen...</div>
            <div class="q-text" id="p1-qtext">Wartet auf den Gongschlag!</div>
        </div>
        <div class="answers-grid">
            <button class="arena-btn" id="p1-opt0" disabled>-</button>
            <button class="arena-btn" id="p1-opt1" disabled>-</button>
            <button class="arena-btn" id="p1-opt2" disabled>-</button>
            <button class="arena-btn" id="p1-opt3" disabled>-</button>
        </div>
    </div>

    <div class="divider"></div>

    <div class="player-zone" id="player2">
        <div class="countdown-overlay" id="p2-countdown">5</div>
        <div class="header-bar">
            <span>factio veneta (blau)</span>
            <div class="health-display" id="p2-health">❤️❤️❤️❤️❤️</div>
        </div>
        <div class="arena-visuals">
            <svg class="gladiator-svg" viewBox="0 0 64 64">
                <circle cx="32" cy="32" r="30" fill="#333" stroke="#0000cc" stroke-width="2"/>
                <path d="M22 18 Q32 2 42 18 Z" fill="#0000cc"/>
                <rect x="24" y="18" width="16" height="20" fill="#d4af37" rx="3"/>
                <rect x="28" y="24" width="8" height="6" fill="#111"/>
                <path d="M52 28 L44 48 L52 48 Z" fill="#0000cc" stroke="#fff"/>
            </svg>
        </div>
        <div class="question-container">
            <div class="q-type" id="p2-qtype">Bereitmachen...</div>
            <div class="q-text" id="p2-qtext">Wartet auf den Gongschlag!</div>
        </div>
        <div class="answers-grid">
            <button class="arena-btn" id="p2-opt0" disabled>-</button>
            <button class="arena-btn" id="p2-opt1" disabled>-</button>
            <button class="arena-btn" id="p2-opt2" disabled>-</button>
            <button class="arena-btn" id="p2-opt3" disabled>-</button>
        </div>
    </div>

    <div class="end-screen" id="end-overlay">
        <div class="end-title" id="end-winner-text">SIEG!</div>
        <p style="font-size: 1.2rem; margin-bottom: 20px;">Die Arena erzittert vor eurem Ruhm.</p>
        <button class="end-btn" id="btn-restart">Nächstes Duell</button>
        <br>
        <a href="index.html" class="end-btn" style="background: #444; color: #fff; font-size: 0.9rem; padding: 8px 20px;">Zurück zur Übersicht</a>
    </div>

    <script>
        let hp = { p1: 5, p2: 5 };
        let currentCorrectAnswer = "";
        let currentDuelItem = null;
        let countdownInterval = null;
        let activePool = [];

        function promptLessonsAndStart() {
            if (typeof globalVocabularyPool === 'undefined' || globalVocabularyPool.length === 0) {
                alert("Fehler: Die Datei 'vocabulary.js' konnte nicht geladen werden!");
                return;
            }
            LessonFilter.show(globalVocabularyPool, function(filteredPool) {
                activePool = filteredPool;
                initArena();
            });
        }

        window.onload = function() {
            document.getElementById('btn-restart').addEventListener('click', promptLessonsAndStart);
            for(let i=0; i<4; i++) {
                document.getElementById(`p1-opt${i}`).addEventListener('click', function() { playerClick(1, i); });
            }
            for(let i=0; i<4; i++) {
                document.getElementById(`p2-opt${i}`).addEventListener('click', function() { playerClick(2, i); });
            }
            promptLessonsAndStart();
        };

        function initArena() {
            if (activePool.length === 0) {
                alert("Fehler: Kein Vokabelpool ausgewählt!");
                return;
            }
            hp = { p1: 5, p2: 5 };
            document.getElementById('end-overlay').style.display = 'none';
            document.getElementById('player1').classList.remove("flash-correct", "flash-wrong");
            document.getElementById('player2').classList.remove("flash-correct", "flash-wrong");
            updateHearts();
            startCountdown();
        }

        function updateHearts() {
            document.getElementById('p1-health').innerText = "❤️".repeat(hp.p1) + "🖤".repeat(5 - hp.p1);
            document.getElementById('p2-health').innerText = "❤️".repeat(hp.p2) + "🖤".repeat(5 - hp.p2);
        }

        function startCountdown() {
            lockAllButtons(true);
            let counter = 5;
            ["p1", "p2"].forEach(p => {
                const overlay = document.getElementById(`${p}-countdown`);
                overlay.style.display = "flex";
                overlay.innerText = counter;
            });

            if(countdownInterval) clearInterval(countdownInterval);
            countdownInterval = setInterval(() => {
                counter--;
                if (counter > 0) {
                    ["p1", "p2"].forEach(p => document.getElementById(`${p}-countdown`).innerText = counter);
                } else if (counter === 0) {
                    ["p1", "p2"].forEach(p => document.getElementById(`${p}-countdown`).innerText = "Pugnate!");
                } else {
                    clearInterval(countdownInterval);
                    ["p1", "p2"].forEach(p => document.getElementById(`${p}-countdown`).style.display = "none");
                    nextRound();
                }
            }, 1000);
        }

        function translateType(type) {
            const types = { noun: "Substantiv", verb: "Verb", adjective: "Adjektiv", adverb: "Adverb", preposition: "Präposition", pronoun: "Pronomen", conjunction: "Konjunktion", other: "Partikel" };
            return types[type] || type;
        }

        function nextRound() {
            const item = activePool[Math.floor(Math.random() * activePool.length)];
            currentDuelItem = item;
            let allowedTypes = [0]; 
            if (item.type === "noun" || item.type === "verb") allowedTypes.push(1, 2);
            if (item.type === "adjective") allowedTypes.push(2);

            const qType = allowedTypes[Math.floor(Math.random() * allowedTypes.length)];
            let questionText = "";
            let categoryText = "";
            let wrongPool = [];

            if (qType === 0) {
                categoryText = `🔮 Bedeutung — ${translateType(item.type)}`;
                questionText = `Was bedeutet „${item.latin}“?`;
                currentCorrectAnswer = item.meaning;
                wrongPool = activePool.filter(i => i.type === item.type && i.meaning !== currentCorrectAnswer).map(i => i.meaning);
            } else if (qType === 1) {
                if (item.type === "noun") {
                    categoryText = "🏛️ Genitiv & Geschlecht";
                    questionText = `Wie lauten Genitiv und Geschlecht von „${item.latin}“?`;
                } else {
                    categoryText = "⚡ Konjugations-Formen";
                    questionText = `Wie lautet die 1. Person Singular Präsens von „${item.latin}“?`;
                }
                currentCorrectAnswer = item.middle;
                wrongPool = activePool.filter(i => i.type === item.type && i.middle !== currentCorrectAnswer && i.middle !== "Ausruf" && i.middle !== "Adv.").map(i => i.middle);
            } else if (qType === 2) {
                if (item.type === "noun") {
                    categoryText = "⚔️ Deklinationsklassen";
                    questionText = `Zu welcher Deklination gehört „${item.latin}“ (${item.gram_clue})?`;
                    currentCorrectAnswer = item.gram_class;
                    wrongPool = ["a-Deklination", "o-Deklination", "konsonantische Deklination", "u-Deklination", "e-Deklination"].filter(c => c !== currentCorrectAnswer);
                } else if (item.type === "verb") {
                    categoryText = "🔥 Konjugationsklassen";
                    questionText = `Zu welcher Konjugation gehört der Infinitiv „${item.latin}“?`;
                    currentCorrectAnswer = item.gram_class;
                    wrongPool = ["a-Konjugation", "e-Konjugation", "i-Konjugation", "konsonantische Konjugation", "gemischte Konjugation"].filter(c => c !== currentCorrectAnswer);
                } else if (item.type === "adjective") {
                    categoryText = "🎨 Adjektiv-Klassen";
                    questionText = `Welcher Deklinationsklasse folgt „${item.latin}“?`;
                    currentCorrectAnswer = item.gram_class;
                    wrongPool = ["a-/o-Deklination", "konsonantische Deklination", "u-Deklination", "e-Deklination"].filter(c => c !== currentCorrectAnswer);
                }
            }

            wrongPool = [...new Set(wrongPool)].sort(() => Math.random() - 0.5).slice(0, 3);
            let safety = 0;
            while (wrongPool.length < 3 && safety < 50) {
                safety++;
                let fb = activePool[Math.floor(Math.random() * activePool.length)];
                let fbVal = qType === 0 ? fb.meaning : fb.middle;
                if(fbVal && fbVal !== currentCorrectAnswer && !wrongPool.includes(fbVal)) {
                    wrongPool.push(fbVal);
                }
            }

            const finalOptions = [currentCorrectAnswer, ...wrongPool].sort(() => Math.random() - 0.5);

            ["p1", "p2"].forEach(p => {
                document.getElementById(`${p}-qtype`).innerText = categoryText;
                document.getElementById(`${p}-qtext`).innerText = questionText;
                const targetZoneId = p === "p1" ? "player1" : "player2";
                document.getElementById(targetZoneId).style.backgroundColor = p === "p1" ? "#221515" : "#151522";
                finalOptions.forEach((opt, idx) => {
                    document.getElementById(`${p}-opt${idx}`).innerText = opt;
                });
            });

            lockAllButtons(false);
        }

        function lockAllButtons(lockState) {
            for(let i=0; i<4; i++) {
                document.getElementById(`p1-opt${i}`).disabled = lockState;
                document.getElementById(`p2-opt${i}`).disabled = lockState;
            }
        }

        function playerClick(playerNum, optIdx) {
            lockAllButtons(true);
            const clickedBtn = document.getElementById(`p${playerNum}-opt${optIdx}`);
            const isCorrect = (clickedBtn.innerText === currentCorrectAnswer);
            LudiProgress.recordVocabAttempt(currentDuelItem.latin, isCorrect);
            let winnerZone = playerNum === 1 ? "player1" : "player2";

            if (isCorrect) {
                if (playerNum === 1) hp.p2--; else hp.p1--;
                document.getElementById(winnerZone).classList.add("flash-correct");
            } else {
                if (playerNum === 1) hp.p1--; else hp.p2--;
                document.getElementById(winnerZone).classList.add("flash-wrong");
            }

            updateHearts();

            setTimeout(() => {
                document.getElementById("player1").classList.remove("flash-correct", "flash-wrong");
                document.getElementById("player2").classList.remove("flash-correct", "flash-wrong");

                if (hp.p1 <= 0 || hp.p2 <= 0) endMatch();
                else startCountdown(); 
            }, 1200);
        }

        function endMatch() {
            const overlay = document.getElementById('end-overlay');
            const winText = document.getElementById('end-winner-text');
            overlay.style.display = "flex";

            if (hp.p1 > hp.p2) {
                winText.innerText = "⚔️ FĪNIS! RUSSATA VINCIT! ⚔️\n(Rot gewinnt das Duell!)";
                winText.style.color = "#cc0000";
            } else {
                winText.innerText = "⚔️ FĪNIS! VENETA VINCIT! ⚔️\n(Blau gewinnt das Duell!)";
                winText.style.color = "#0000cc";
            }
        }
    </script>
</body>
</html>
