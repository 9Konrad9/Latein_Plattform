<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Gladiatoren-Duell - Split-Screen</title>
    <style>
        :root {
            --roman-gold: #d4af37;
            --roman-bronze: #8c7853;
            --roman-red: #800000;
            --bg-dark: #121212;
            --card-bg: #2d2d2d;
            --text-light: #f5f5f5;
            --font-display: 'Georgia', 'Times New Roman', serif;
            --font-body: 'Verdana', sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }

        body {
            font-family: var(--font-body);
            background-color: var(--bg-dark);
            color: var(--text-light);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .divider {
            height: 6px;
            background: var(--roman-gold);
            width: 100%;
            box-shadow: 0 0 10px rgba(0,0,0,0.8);
            z-index: 10;
        }

        .player-zone {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 12px;
            position: relative;
            background-color: #1a1a1a;
            transition: background-color 0.2s ease;
        }

        /* SPIELER 1 WIRD UM 180 GRAD GEDREHT */
        #player1 {
            transform: rotate(180deg);
            background-color: #221515;
        }

        #player2 {
            background-color: #151522;
        }

        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-family: var(--font-display);
            font-size: 1rem;
            color: var(--roman-gold);
            border-bottom: 1px solid #444;
            padding-bottom: 5px;
        }

        .health-display { font-size: 1.2rem; letter-spacing: 2px; }

        .arena-visuals {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin: 5px 0;
        }

        .gladiator-svg {
            width: 50px;
            height: 50px;
            filter: drop-shadow(2px 2px 4px rgba(0,0,0,0.5));
        }

        .question-container {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            text-align: center;
            padding: 8px;
            background: rgba(0,0,0,0.4);
            border-radius: 6px;
            border-left: 4px solid var(--roman-gold);
            margin-bottom: 8px;
            min-height: 80px;
        }

        .q-type { font-size: 0.8rem; text-transform: uppercase; color: var(--roman-gold); font-weight: bold; margin-bottom: 2px; letter-spacing: 1px; }
        .q-text { font-family: var(--font-body); font-size: 1.15rem; color: var(--roman-marble); line-height: 1.3; }

        .answers-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }

        .arena-btn {
            background: var(--card-bg);
            border: 2px solid var(--roman-bronze);
            color: white;
            padding: 16px 5px;
            font-size: 1.05rem;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            text-align: center;
            -webkit-tap-highlight-color: transparent;
        }

        .countdown-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15,15,15,0.92);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 20;
            font-family: var(--font-display);
            font-size: 3.5rem;
            color: var(--roman-gold);
            font-weight: bold;
            text-transform: uppercase;
        }

        .flash-correct { background-color: #4CAF50 !important; }
        .flash-wrong { background-color: #F44336 !important; }

        .end-screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            text-align: center;
            padding: 20px;
        }

        .end-title { font-family: var(--font-display); font-size: 2.2rem; color: var(--roman-gold); margin-bottom: 15px; }
        .end-btn {
            background: var(--roman-gold); color: var(--roman-red);
            font-family: var(--font-display); font-weight: bold; padding: 12px 35px;
            border: none; border-radius: 20px; font-size: 1.2rem; cursor: pointer; text-transform: uppercase;
            text-decoration: none; margin-top: 15px; display: inline-block;
        }
    </style>
</head>
<body>

    <div class="player-zone" id="player1">
        <div class="countdown-overlay" id="p1-countdown">5</div>
        <div class="header-bar">
            <span>factio russata (rot)</span>
            <div class="health-display" id="p1-health">❤️❤️❤️❤️❤️</div>
        </div>
        <div class="arena-visuals">
            <svg class="gladiator-svg" viewBox="0 0 64 64">
                <circle cx="32" cy="32" r="30" fill="#333" stroke="#cc0000" stroke-width="2"/>
                <path d="M22 18 Q32 2 42 18 Z" fill="#cc0000"/>
                <rect x="24" y="18" width="16" height="20" fill="#d4af37" rx="3"/>
                <rect x="28" y="24" width="8" height="6" fill="#111"/>
                <path d="M12 28 L20 48 L12 48 Z" fill="#cc0000" stroke="#fff"/>
            </svg>
        </div>
        <div class="question-container">
            <div class="q-type" id="p1-qtype">Bereitmachen...</div>
            <div class="q-text" id="p1-qtext">---</div>
        </div>
        <div class="answers-grid">
            <button class="arena-btn" id="p1-opt0" onclick="playerClick(1, 0)">-</button>
            <button class="arena-btn" id="p1-opt1" onclick="playerClick(1, 1)">-</button>
            <button class="arena-btn" id="p1-opt2" onclick="playerClick(1, 2)">-</button>
            <button class="arena-btn" id="p1-opt3" onclick="playerClick(1, 3)">-</button>
        </div>
    </div>

    <div class="divider"></div>

    <div class="player-zone" id="player2">
        <div class="countdown-overlay" id="p2-countdown">5</div>
        <div class="header-bar">
            <span>factio veneta (blau)</span>
            <div class="health-display" id="p2-health">❤️❤️❤️❤️❤️</div>
        </div>
        <div class="arena-visuals">
            <svg class="gladiator-svg" viewBox="0 0 64 64">
                <circle cx="32" cy="32" r="30" fill="#333" stroke="#0000cc" stroke-width="2"/>
                <path d="M22 18 Q32 2 42 18 Z" fill="#0000cc"/>
                <rect x="24" y="18" width="16" height="20" fill="#d4af37" rx="3"/>
                <rect x="28" y="24" width="8" height="6" fill="#111"/>
                <path d="M52 28 L44 48 L52 48 Z" fill="#0000cc" stroke="#fff"/>
            </svg>
        </div>
        <div class="question-container">
            <div class="q-type" id="p2-qtype">Bereitmachen...</div>
            <div class="q-text" id="p2-qtext">---</div>
        </div>
        <div class="answers-grid">
            <button class="arena-btn" id="p2-opt0" onclick="playerClick(2, 0)">-</button>
            <button class="arena-btn" id="p2-opt1" onclick="playerClick(2, 1)">-</button>
            <button class="arena-btn" id="p2-opt2" onclick="playerClick(2, 2)">-</button>
            <button class="arena-btn" id="p2-opt3" onclick="playerClick(2, 3)">-</button>
        </div>
    </div>

    <div class="end-screen" id="end-overlay">
        <div class="end-title" id="end-winner-text">SIEG!</div>
        <p style="font-size: 1.2rem; margin-bottom: 20px;">Die Arena erzittert vor eurem Ruhm.</p>
        <button class="end-btn" onclick="resetArena()">Nächstes Duell</button>
        <br>
        <a href="index.html" class="end-btn" style="background: #444; color: #fff; font-size: 0.9rem; padding: 8px 20px;">Zurück zur Übersicht</a>
    </div>

    <script>
        // DER VOLLSTÄNDIGE MASTER-VOKABELPOOL AUS DEM WAGENRENNEN (KOMPLETT KLEINGESCHRIEBEN)
        const vocabularyPool = [
            { latin: "salvē!", type: "other", middle: "Ausruf", gram_clue: "", gram_class: "", meaning: "Sei begrüßt!" },
            { latin: "pater", type: "noun", middle: "patris m.", gram_clue: "Genitiv: patris, m.", gram_class: "konsonantische Deklination", meaning: "der Vater" },
            { latin: "māter", type: "noun", middle: "mātris f.", gram_clue: "Genitiv: mātris, f.", gram_class: "konsonantische Deklination", meaning: "die Mutter" },
            { latin: "fīlius", type: "noun", middle: "fīliī m.", gram_clue: "Genitiv: fīliī, m.", gram_class: "o-Deklination", meaning: "der Sohn" },
            { latin: "fīlia", type: "noun", middle: "fīliae f.", gram_clue: "Genitiv: fīliae, f.", gram_class: "a-Deklination", meaning: "die Tochter" },
            { latin: "avus", type: "noun", middle: "avī m.", gram_clue: "Genitiv: avī, m.", gram_class: "o-Deklination", meaning: "der Großvater" },
            { latin: "servus", type: "noun", middle: "servī m.", gram_clue: "Genitiv: servī, m.", gram_class: "o-Deklination", meaning: "der Sklave" },
            { latin: "serva", type: "noun", middle: "servae f.", gram_clue: "Genitiv: servae, f.", gram_class: "a-Deklination", meaning: "die Sklavin" },
            { latin: "catella", type: "noun", middle: "catellae f.", gram_clue: "Genitiv: catellae, f.", gram_class: "a-Deklination", meaning: "das Hündchen" },
            { latin: "hic", type: "other", middle: "Adv.", gram_clue: "", gram_class: "", meaning: "hier" },
            { latin: "est", type: "verb", middle: "sum", gram_clue: "1. Pers. Sg.: sum", gram_class: "unregelmäßiges Verb", meaning: "er/sie/es ist; es gibt" },
            { latin: "dominus", type: "noun", middle: "dominī m.", gram_clue: "Genitiv: dominī, m.", gram_class: "o-Deklination", meaning: "der Herr, der Hausherr" },
            { latin: "clāmat", type: "verb", middle: "clāmō", gram_clue: "1. Pers. Sg.: clāmō", gram_class: "a-Konjugation", meaning: "er/sie/es ruft" },
            { latin: "venit", type: "verb", middle: "veniō", gram_clue: "1. Pers. Sg.: veniō", gram_class: "i-Konjugation", meaning: "er/sie/es kommt" },
            { latin: "domina", type: "noun", middle: "dominae f.", gram_clue: "Genitiv: dominae, f.", gram_class: "a-Deklination", meaning: "die Hausherrin" },
            { latin: "labōrat", type: "verb", middle: "labōrō", gram_clue: "1. Pers. Sg.: labōrō", gram_class: "a-Konjugation", meaning: "er/sie/es arbeitet" },
            { latin: "lūdit", type: "verb", middle: "lūdō", gram_clue: "1. Pers. Sg.: lūdō", gram_class: "konsonantische Konjugation", meaning: "er/sie/es spielt" },
            { latin: "cantat", type: "verb", middle: "cantō", gram_clue: "1. Pers. Sg.: cantō", gram_class: "a-Konjugation", meaning: "er/sie/es singt" },
            { latin: "et", type: "other", middle: "Konj.", gram_clue: "", gram_class: "", meaning: "und" },
            { latin: "gaudet", type: "verb", middle: "gaudeō", gram_clue: "1. Pers. Sg.: gaudeō", gram_class: "e-Konjugation", meaning: "er/sie/es freut sich" },
            { latin: "currit", type: "verb", middle: "currō", gram_clue: "1. Pers. Sg.: currō", gram_class: "konsonantische Konjugation", meaning: "er/sie/es läuft" },
            { latin: "nam", type: "other", middle: "Konj.", gram_clue: "", gram_class: "", meaning: "denn" },
            { latin: "hodiē", type: "other", middle: "Adv.", gram_clue: "", gram_class: "", meaning: "heute" },
            { latin: "familia", type: "noun", middle: "familiae f.", gram_clue: "Genitiv: familiae, f.", gram_class: "a-Deklination", meaning: "die Familie, Hausgemeinschaft" },
            { latin: "exspectat", type: "verb", middle: "exspectō", gram_clue: "1. Pers. Sg.: exspectō", gram_class: "a-Konjugation", meaning: "er/sie/es erwartet" },
            { latin: "subitō", type: "other", middle: "Adv.", gram_clue: "", gram_class: "", meaning: "plötzlich" },
            { latin: "clāmor", type: "noun", middle: "clāmōris m.", gram_clue: "Genitiv: clāmōris, m.", gram_class: "konsonantische Deklination", meaning: "der Lärm, das Geschrei" },
            { latin: "audit", type: "verb", middle: "audiō", gram_clue: "1. Pers. Sg.: audiō", gram_class: "i-Konjugation", meaning: "er/sie/es hears (zu)" },
            { latin: "rogat", type: "verb", middle: "rogō", gram_clue: "1. Pers. Sg.: rogō", gram_class: "a-Konjugation", meaning: "er/sie/es fragt" },
            { latin: "quid?", type: "other", middle: "Pronomen", gram_clue: "", gram_class: "", meaning: "was?" },
            { latin: "quaerit", type: "verb", middle: "quaerō", gram_clue: "1. Pers. Sg.: quaerō", gram_class: "konsonantische Konjugation", meaning: "er/sie/es sucht" },
            { latin: "nōn", type: "other", middle: "Negation", gram_clue: "", gram_class: "", meaning: "nicht" },
            { latin: "videt", type: "verb", middle: "videō", gram_clue: "1. Pers. Sg.: videō", gram_class: "e-Konjugation", meaning: "er/sie/es sieht" },
            { latin: "sed", type: "other", middle: "Konj.", gram_clue: "", gram_class: "", meaning: "aber, sondern" },
            { latin: "ubi?", type: "other", middle: "Adv.", gram_clue: "", gram_class: "", meaning: "wo?" },
            { latin: "ecce!", type: "other", middle: "Ausruf", gram_clue: "", gram_class: "", meaning: "sieh(e) da!" },
            { latin: "intrat", type: "verb", middle: "intrō", gram_clue: "1. Pers. Sg.: intrō", gram_class: "a-Konjugation", meaning: "er/sie/es betritt" },
            { latin: "tum", type: "other", middle: "Adv.", gram_clue: "", gram_class: "", meaning: "dann, darauf" },
            { latin: "ibi", type: "other", middle: "Adv.", gram_clue: "", gram_class: "", meaning: "dort" },
            { latin: "nunc", type: "other", middle: "Adv.", gram_clue: "", gram_class: "", meaning: "nun, jetzt" },
            { latin: "etiam", type: "other", middle: "Konj.", gram_clue: "", gram_class: "", meaning: "auch" },
            { latin: "ridet", type: "verb", middle: "rīdeō", gram_clue: "1. Pers. Sg.: rīdeō", gram_class: "e-Konjugation", meaning: "er/sie/es lacht" },
            { latin: "tenet", type: "verb", middle: "teneō", gram_clue: "1. Pers. Sg.: teneō", gram_class: "e-Konjugation", meaning: "er/sie/es hält" },
            { latin: "cōnsīdere", type: "verb", middle: "cōnsīdō", gram_clue: "1. Pers. Sg.: cōnsīdō", gram_class: "konsonantische Konjugation", meaning: "sich hinsetzen" },
            { latin: "vincere", type: "verb", middle: "vincō", gram_clue: "1. Pers. Sg.: vincō", gram_class: "konsonantische Konjugation", meaning: "siegen, besiegen" }
        ];

        let hp = { p1: 5, p2: 5 };
        let currentCorrectAnswer = "";
        let roundLocked = true; 

        function initArena() {
            hp = { p1: 5, p2: 5 };
            document.getElementById('end-overlay').style.display = 'none';
            updateHearts();
            startCountdown();
        }

        function updateHearts() {
            document.getElementById('p1-health').innerText = "❤️".repeat(hp.p1) + "🖤".repeat(5 - hp.p1);
            document.getElementById('p2-health').innerText = "❤️".repeat(hp.p2) + "🖤".repeat(5 - hp.p2);
        }

        function startCountdown() {
            roundLocked = true;
            let counter = 5;
            
            ["p1", "p2"].forEach(p => {
                const overlay = document.getElementById(`${p}-countdown`);
                overlay.style.display = "flex";
                overlay.innerText = counter;
            });

            let interval = setInterval(() => {
                counter--;
                if (counter > 0) {
                    ["p1", "p2"].forEach(p => document.getElementById(`${p}-countdown`).innerText = counter);
                } else if (counter === 0) {
                    ["p1", "p2"].forEach(p => document.getElementById(`${p}-countdown`).innerText = "Pugnate!");
                } else {
                    clearInterval(interval);
                    ["p1", "p2"].forEach(p => document.getElementById(`${p}-countdown`).style.display = "none");
                    nextRound();
                }
            }, 1000);
        }

        // INTELLIGENTER INTEGRIERTER ABLENKER-ALGORITHMUS AUS DEM WAGENRENNEN
        function getSmartWrongMiddles(item) {
            let wrongs = [];
            if (item.type === 'noun') {
                let parts = item.middle.split(' ');
                let form = parts[0]; 
                let genus = parts[1] || 'm.';
                let oppGenus = (genus === 'm.') ? 'f.' : (genus === 'f.' ? 'm.' : 'n.');
                
                wrongs.push(`${form} ${oppGenus}`);
                let base = form.replace(/(is|ī|ae|iī|is|um|īs)$/, '');
                if (base.length < 2) base = form; 
                
                wrongs.push(`${base}ī ${genus}`);
                wrongs.push(`${base}ae ${genus}`);
                wrongs.push(`${base}ī ${oppGenus}`);
                wrongs.push(`${base}is ${oppGenus}`);
            } else if (item.type === 'verb') {
                let form = item.middle;
                let base = form.replace(/(ō|iō|eō|ō)$/, '');
                if (base.length < 2) base = form;
                
                wrongs.push(`${base}it`);
                wrongs.push(`${base}at`);
                wrongs.push(`${base}et`);
                wrongs.push(`${base}unt`);
            }
            return [...new Set(wrongs)].filter(w => w !== item.middle && w !== "");
        }

        function nextRound() {
            roundLocked = false;
            
            const item = vocabularyPool[Math.floor(Math.random() * vocabularyPool.length)];
            let qType = Math.floor(Math.random() * 3);
            
            if (item.type === "other" && qType > 0) {
                qType = 0; 
            }

            let questionText = "";
            let categoryText = "";
            let correctAnswer = "";
            let wrongPool = [];

            // REINES KLASSENMODELL WIE IM WAGENRENNEN
            if (qType === 0) {
                categoryText = "🔮 Vokabel-Bedeutung";
                questionText = `Was bedeutet das Wort „${item.latin}“?`;
                correctAnswer = item.meaning;
                wrongPool = vocabularyPool.map(i => i.meaning).filter(m => m !== correctAnswer);
            } 
            else if (qType === 1) {
                if (item.type === "noun") {
                    categoryText = "🏛️ Genitiv & Geschlecht";
                    questionText = `Wie lauten Genitiv und Geschlecht von „${item.latin}“?`;
                } else if (item.type === "verb") {
                    categoryText = "⚡ Verb-Formen";
                    questionText = `Wie lautet die 1. Person Singular von „${item.latin}“?`;
                }
                correctAnswer = item.middle;
                
                wrongPool = getSmartWrongMiddles(item);
                if (wrongPool.length < 3) {
                    let backupPool = vocabularyPool.filter(i => i.type === item.type).map(i => i.middle).filter(m => m !== correctAnswer);
                    wrongPool = [...wrongPool, ...backupPool];
                }
            } 
            else if (qType === 2) {
                if (item.type === "noun") {
                    categoryText = "⚔️ Arena der Deklinationen";
                    questionText = `Zu welcher Deklination gehört „${item.latin}“ (${item.gram_clue})?`;
                    correctAnswer = item.gram_class;
                    wrongPool = ["a-Deklination", "o-Deklination", "konsonantische Deklination"].filter(c => c !== correctAnswer);
                } else if (item.type === "verb") {
                    categoryText = "🔥 Arena der Konjugationen";
                    questionText = `Zu welcher Konjugation gehört „${item.latin}“ (${item.gram_clue})?`;
                    correctAnswer = item.gram_class;
                    wrongPool = ["a-Konjugation", "e-Konjugation", "i-Konjugation", "konsonantische Konjugation", "gemischte Konjugation"].filter(c => c !== correctAnswer);
                }
            }

            currentCorrectAnswer = correctAnswer;
            wrongPool = [...new Set(wrongPool)].sort(() => Math.random() - 0.5).slice(0, 3);
            while(wrongPool.length < 3) wrongPool.push("---");

            const options = [correctAnswer, ...wrongPool].sort(() => Math.random() - 0.5);

            ["p1", "p2"].forEach(p => {
                document.getElementById(`${p}-qtype`).innerText = categoryText;
                document.getElementById(`${p}-qtext`).innerText = questionText;
                
                const targetZoneId = p === "p1" ? "player1" : "player2";
                document.getElementById(targetZoneId).style.backgroundColor = p === "p1" ? "#221515" : "#151522";

                options.forEach((opt, idx) => {
                    const btn = document.getElementById(`${p}-opt${idx}`);
                    btn.innerText = opt;
                    btn.className = "arena-btn";
                    btn.disabled = false;
                });
            });
        }

        function playerClick(playerNum, optIdx) {
            if (roundLocked) return;
            roundLocked = true; 

            const clickedBtn = document.getElementById(`p${playerNum}-opt${optIdx}`);
            const isCorrect = (clickedBtn.innerText === currentCorrectAnswer);

            let winnerZone = playerNum === 1 ? "player1" : "player2";

            if (isCorrect) {
                if (playerNum === 1) hp.p2--; else hp.p1--;
                document.getElementById(winnerZone).classList.add("flash-correct");
            } else {
                if (playerNum === 1) hp.p1--; else hp.p2--;
                document.getElementById(winnerZone).classList.add("flash-wrong");
            }

            updateHearts();

            for(let i=0; i<4; i++) {
                document.getElementById(`p1-opt${i}`).disabled = true;
                document.getElementById(`p2-opt${i}`).disabled = true;
            }

            setTimeout(() => {
                document.getElementById("player1").classList.remove("flash-correct", "flash-wrong");
                document.getElementById("player2").classList.remove("flash-correct", "flash-wrong");

                if (hp.p1 <= 0 || hp.p2 <= 0) {
                    endMatch();
                } else {
                    startCountdown(); 
                }
            }, 1200);
        }

        function endMatch() {
            const overlay = document.getElementById('end-overlay');
            const winText = document.getElementById('end-winner-text');
            overlay.style.display = "flex";

            if (hp.p1 > hp.p2) {
                winText.innerText = "⚔️ FĪNIS! RUSṢATA VINCIṬ! ⚔️\n(Rot gewinnt das Duell!)";
                winText.style.color = "#cc0000";
            } else {
                winText.innerText = "⚔️ FĪNIS! VENETA VINCIT! ⚔️\n(Blau gewinnt das Duell!)";
                winText.style.color = "#0000cc";
            }
        }

        function resetArena() {
            initArena();
        }

        window.onload = initArena;
    </script>
</body>
</html>
