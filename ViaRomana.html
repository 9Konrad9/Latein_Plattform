<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Via Rōmāna - Satzbau-Wegweiser</title>
    <style>
        :root {
            --roman-gold: #d4af37;
            --stone-dark: #2c3e50;
            --stone-light: #7f8c8d;
            --bg-dark: #1a1a1a;
            --card-bg: #2d2d2d;
            --highlight-cyan: #00d2d3;
            --leather-brown: #5c3d2e;
            --text-light: #f5f5f5;
            --font-display: 'Georgia', 'Times New Roman', serif;
            --font-body: 'Verdana', sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }

        body {
            font-family: var(--font-body);
            background-color: var(--bg-dark);
            background-image: linear-gradient(135deg, #111 0%, #222 100%);
            color: var(--text-light);
            height: 100dvh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 15px;
            overflow: hidden;
        }

        .header-area {
            width: 100%; max-width: 800px;
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 20px; border-bottom: 2px solid var(--roman-bronze); padding-bottom: 10px;
        }
        .title { font-family: var(--font-display); font-size: 1.6rem; color: var(--roman-gold); text-transform: uppercase; letter-spacing: 2px; }
        .task-instruction { font-size: 0.95rem; color: #aaa; font-style: italic; }

        /* Der Satz-Bildschirm */
        .sentence-box {
            width: 100%; max-width: 800px;
            background: #222;
            border: 3px solid var(--stone-light);
            border-radius: 12px;
            padding: 30px 20px;
            margin-bottom: 25px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.6);
            display: flex; justify-content: center; align-items: center;
            min-height: 120px;
        }

        .sentence-text {
            font-family: var(--font-display);
            font-size: 2.2rem;
            letter-spacing: 1px;
            text-align: center;
            line-height: 1.4;
            /* Strikte Kleinschreibung für alle lateinischen Wörter */
            text-transform: lowercase;
        }

        .highlight {
            color: var(--highlight-cyan);
            border-bottom: 4px dashed var(--highlight-cyan);
            padding-bottom: 2px;
            font-weight: bold;
        }

        /* Syntax-Buttons Grid (2x2) */
        .syntax-grid {
            width: 100%; max-width: 800px;
            display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px;
            flex-grow: 1; margin-bottom: 25px;
        }

        .btn-syntax {
            background: var(--card-bg);
            border: 2px solid var(--stone-light);
            color: #fff;
            font-size: 1.3rem;
            font-family: var(--font-display);
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 5px 12px rgba(0,0,0,0.4);
            display: flex; align-items: center; justify-content: center;
            touch-action: manipulation; -webkit-tap-highlight-color: transparent;
            transition: background 0.1s, border-color 0.1s;
        }
        .btn-syntax:not(:disabled):active {
            background: #444;
            transform: translateY(2px);
        }

        /* Die römische Meilenstein-Straße */
        .road-container {
            width: 100%; max-width: 800px;
            background: #333;
            border-radius: 8px;
            padding: 15px 10px;
            border: 2px solid var(--roman-gold);
            position: relative; margin-top: auto;
        }
        .milestones-track {
            display: flex; justify-content: space-between; align-items: center;
            position: relative; background: #222; height: 6px; border-radius: 3px; margin: 15px 10px 5px 10px;
        }
        .stone {
            width: 20px; height: 20px; background: var(--stone-light);
            border-radius: 50%; border: 2px solid #555;
            position: relative; z-index: 2; transition: background 0.3s;
        }
        .stone.active { background: var(--roman-gold); border-color: #fff; box-shadow: 0 0 8px var(--roman-gold); }
        
        /* Der Reisewagen (Carpentum) */
        .carpentum {
            position: absolute; top: -28px; left: 0;
            font-size: 1.8rem; z-index: 3;
            transition: left 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            transform: translateX(-50%);
        }

        /* Feedback Modal (Der Archivar) */
        .modal-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); display: none; align-items: center; justify-content: center; z-index: 100;
        }
        .feedback-box {
            background: #2f3640; width: 90%; max-width: 500px;
            border: 5px solid var(--roman-gold); border-radius: 8px; padding: 25px; text-align: center;
        }
        .feedback-title { color: var(--roman-gold); font-family: var(--font-display); font-size: 1.6rem; margin-bottom: 15px; }
        .feedback-text { font-size: 1.1rem; line-height: 1.5; color: #fff; margin-bottom: 25px; }
        .btn-close {
            background: var(--roman-gold); color: #000; border: none; padding: 12px 35px;
            font-size: 1.1rem; font-weight: bold; border-radius: 20px; cursor: pointer;
        }

        /* Endbildschirm */
        .end-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg-dark); display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 200; text-align: center;
        }
        .btn-main { background: var(--roman-gold); color: #000; border: none; padding: 15px 40px; font-size: 1.2rem; font-weight: bold; border-radius: 30px; cursor: pointer; text-decoration: none; margin-top: 20px; text-transform: uppercase; }
    </style>
</head>
<body>

    <div class="header-area">
        <div class="title">Via Rōmāna</div>
        <div class="task-instruction">Bestimme das blau markierte Satzglied!</div>
    </div>

    <div class="sentence-box">
        <div class="sentence-text" id="sentence-display">lade via...</div>
    </div>

    <div class="syntax-grid">
        <button class="btn-syntax" id="btn-sub">Subjekt</button>
        <button class="btn-syntax" id="btn-praed">Prädikat</button>
        <button class="btn-syntax" id="btn-obj">Akkusativ-Objekt</button>
        <button class="btn-syntax" id="btn-attr">Genitiv-Attribut</button>
    </div>

    <div class="road-container">
        <div style="font-size: 0.8rem; color: #ccc; text-align: center; font-weight: bold; text-transform: uppercase; letter-spacing: 1px;">Weg nach Rom (Meilensteine)</div>
        <div class="milestones-track">
            <div class="carpentum" id="wagon">🐎</div>
            <div class="stone active" id="st0"></div>
            <div class="stone" id="st1"></div>
            <div class="stone" id="st2"></div>
            <div class="stone" id="st3"></div>
            <div class="stone" id="st4"></div>
            <div class="stone" id="st5"></div>
            <div class="stone" id="st6"></div>
            <div class="stone" id="st7"></div>
            <div class="stone" id="st8"></div>
            <div class="stone" id="st9"></div>
            <div class="stone" id="st10"></div>
        </div>
    </div>

    <div class="modal-overlay" id="feedback-modal">
        <div class="feedback-box">
            <div class="feedback-title">Wegweiser-Hinweis</div>
            <div class="feedback-text" id="feedback-text">Fehlermeldung...</div>
            <button class="btn-close" onclick="closeModal()">Satz neu analysieren</button>
        </div>
    </div>

    <div class="end-screen" id="end-screen">
        <h1 style="color: var(--roman-gold); font-size: 3rem; margin-bottom: 20px; font-family: 'Georgia', serif;">Roma reached!</h1>
        <p style="font-size: 1.3rem; max-width: 600px; line-height: 1.5; margin-bottom: 30px; padding: 0 20px;">Großartig! Du hast alle Meilensteine gemeistert und die Allee nach Rom fehlerfrei entschlüsselt. Die Strukturen sitzen!</p>
        <button class="btn-main" onclick="location.reload()">Neue Reise starten</button>
        <a href="index.html" class="btn-main" style="background: #444; color: #fff; font-size: 1rem;">Zurück zur Übersicht</a>
    </div>

    <script src="progress.js"></script>
    <script>
        // --- SYNTAX SPEZIFISCHES ENGINEMAPPING ---
        const poolSubjekts = [
            { sg: "servus", pl: "servī", type: "m" },
            { sg: "puella", pl: "puellae", type: "f" },
            { sg: "puer", pl: "puerī", type: "m" },
            { sg: "dominus", pl: "dominī", type: "m" },
            { sg: "domina", pl: "dominae", type: "f" },
            { sg: "amicus", pl: "amicī", type: "m" },
            { sg: "fīlius", pl: "fīliī", type: "m" },
            { sg: "fīlia", pl: "fīliae", type: "f" }
        ];

        const poolObjekts = [
            { sg: "equum", pl: "equōs", base: "equus" },
            { sg: "canem", pl: "canēs", base: "canis" },
            { sg: "tunicam", pl: "tunicās", base: "tunica" },
            { sg: "tabulam", pl: "tabulās", base: "tabula" },
            { sg: "dōnum", pl: "dōna", base: "dōnum" }
        ];

        const poolAttributes = [
            { sg: "servī", pl: "servōrum" },
            { sg: "puellae", pl: "puellārum" },
            { sg: "dominī", pl: "dominōrum" },
            { sg: "magistrī", pl: "magistrōrum" },
            { sg: "aulī", pl: "aulī" } // Eigenname bleibt gleich
        ];

        const poolVerbs = [
            { sg: "videt", pl: "vident" },
            { sg: "audit", pl: "audiunt" },
            { sg: "vocat", pl: "vocant" },
            { sg: "salūtat", pl: "salūtant" },
            { sg: "portat", pl: "portant" }
        ];

        let score = 0;
        const targetScore = 10;
        let currentTargetRole = ""; 
        let currentExplanation = "";

        window.onload = function() {
            setupButtons();
            nextQuestion();
        };

        function setupButtons() {
            document.getElementById('btn-sub').onclick = () => checkAnswer("sub");
            document.getElementById('btn-praed').onclick = () => checkAnswer("praed");
            document.getElementById('btn-obj').onclick = () => checkAnswer("obj");
            document.getElementById('btn-attr').onclick = () => checkAnswer("attr");
        }

        function nextQuestion() {
            // Zufälligen Satzbauplan wählen (1, 2 oder 3)
            let plan = Math.floor(Math.random() * 3) + 1;
            let sub = poolSubjekts[Math.floor(Math.random() * poolSubjekts.length)];
            let verb = poolVerbs[Math.floor(Math.random() * poolVerbs.length)];
            
            let subPlural = Math.random() > 0.5;
            let verbForm = subPlural ? verb.pl : verb.sg;
            let subForm = subPlural ? sub.pl : sub.sg;

            let words = [];

            if (plan === 1) {
                // Plan 1: Subjekt + Objekt + Prädikat
                let obj = poolObjekts[Math.floor(Math.random() * poolObjekts.length)];
                let objPlural = Math.random() > 0.5;
                let objForm = objPlural ? obj.pl : obj.sg;

                words = [
                    { w: subForm, role: "sub", exp: "Dieses Wort steht im Nominativ und bestimmt, wer oder was handelt. Es passt perfekt zum Prädikat!" },
                    { w: objForm, role: "obj", exp: "Das Wort endet auf die Akkusativ-Endung (-um/-am/-ōs/-ās/-em). Es ist das direkte Ziel der Handlung (Wen-oder-Was-Frage)." },
                    { w: verbForm, role: "praed", exp: "Das ist das Zeitwort (Verb) am Satzende. Die Endung (-t oder -nt) zeigt an, ob eine oder viele Personen handeln." }
                ];
            } else if (plan === 2) {
                // Plan 2: Subjekt + Genitiv-Attribut + Prädikat
                let attr = poolAttributes[Math.floor(Math.random() * poolAttributes.length)];
                let attrPlural = Math.random() > 0.5 && attr.sg !== "aulī";
                let attrForm = attrPlural ? attr.pl : attr.sg;

                words = [
                    { w: subForm, role: "sub", exp: "Nominativform. Lass dich nicht verwirren: Auch wenn das Attribut direkt daneben steht, ist das hier das Subjekt." },
                    { w: attrForm, role: "attr", exp: "Das ist ein Genitiv (wessen?). Es beschreibt den Besitzer näher und hängt direkt als Attribut an einem anderen Substantiv." },
                    { w: verbForm, role: "praed", exp: "Das Prädikat bestimmt die Person des Satzes. Schau immer zuerst nach dem Prädikat!" }
                ];
            } else {
                // Plan 3: Subjekt + Genitiv-Attribut + Akkusativ-Objekt + Prädikat (Vollkomplex)
                let attr = poolAttributes[Math.floor(Math.random() * poolAttributes.length)];
                let attrPlural = Math.random() > 0.5 && attr.sg !== "aulī";
                let attrForm = attrPlural ? attr.pl : attr.sg;

                let obj = poolObjekts[Math.floor(Math.random() * poolObjekts.length)];
                let objPlural = Math.random() > 0.5;
                let objForm = objPlural ? obj.pl : obj.sg;

                words = [
                    { w: subForm, role: "sub", exp: "Das handelnde Subjekt im Nominativ." },
                    { w: attrForm, role: "attr", exp: "Ein Genitiv-Attribut, das klärt, wessen Besitz oder Bezug gemeint ist." },
                    { w: objForm, role: "obj", exp: "Das Akkusativ-Objekt des Satzes (Ziel der Handlung)." },
                    { w: verbForm, role: "praed", exp: "Das Prädikat (Verb), das die gesamte Aktion steuert." }
                ];
            }

            // Für die zusätzliche Hürde: Die Satzglieder ab und zu durchmischen (Wortstellungs-Falle)
            // Das Prädikat bleibt didaktisch sinnvoll meist hinten, aber Subjekt/Objekt/Attribut rotieren!
            if (Math.random() > 0.5) {
                let praedRef = words.pop();
                words.sort(() => Math.random() - 0.5);
                words.push(praedRef);
            }

            // Zufällig ein Satzglied auswählen, das abgefragt werden soll
            let targetIdx = Math.floor(Math.random() * words.length);
            currentTargetRole = words[targetIdx].role;
            currentExplanation = words[targetIdx].exp;

            // HTML-String generieren (Garantiert komplett kleingeschrieben im Latein)
            let htmlOutput = "";
            words.forEach((item, idx) => {
                let lowWord = item.w.toLowerCase();
                if (idx === targetIdx) {
                    htmlOutput += `<span class="highlight">${lowWord}</span> `;
                } else {
                    htmlOutput += `${lowWord} `;
                }
            });

            document.getElementById('sentence-display').innerHTML = htmlOutput.trim() + ".";
        }

        function checkAnswer(chosenRole) {
            if (chosenRole === currentTargetRole) {
                score++;
                updateWagon();
                if (score >= targetScore) {
                    LudiProgress.saveGameResult('viaromana', score, targetScore);
                    document.getElementById('end-screen').style.display = 'flex';
                } else {
                    nextQuestion();
                }
            } else {
                let roleNames = { sub: "das Subjekt", praed: "das Prädikat", obj: "an ein Akkusativ-Objekt", attr: "an ein Genitiv-Attribut" };
                showModal(`Halt! Das war nicht richtig. Hier ist ein Tipp für dieses Wort:\n\n${currentExplanation}`);
            }
        }

        function updateWagon() {
            // Berechne die prozentuale Position für den Wagen auf der Strecke
            let percentage = (score / targetScore) * 100;
            document.getElementById('wagon').style.left = `${percentage}%`;

            // Aktiviere den Meilenstein-Punkt optisch
            for (let i = 0; i <= targetScore; i++) {
                let stone = document.getElementById(`st${i}`);
                if (i <= score) {
                    stone.classList.add('active');
                } else {
                    stone.classList.remove('active');
                }
            }
        }

        function showModal(text) {
            document.getElementById('feedback-text').innerText = text;
            document.getElementById('feedback-modal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('feedback-modal').style.display = 'none';
        }
    </script>
</body>
</html>
